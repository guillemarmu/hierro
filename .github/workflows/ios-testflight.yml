# Compila Hierro para iOS FIRMADO y lo sube a App Store Connect (TestFlight).
# Se lanza a mano: Actions › «iOS TestFlight» › Run workflow.
# Firma automática con la clave de la API de App Store Connect (función Administración); sin Mac ni certificados a mano.
# Secretos del repo (los pone Guillermo): ASC_KEY_ID, ASC_ISSUER_ID y ASC_KEY_P8 (contenido entero del .p8).
name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Número de compilación (vacío = 100 + número de ejecución). Tiene que ser mayor que el último subido.'
        required: false
        default: ''
permissions:
  contents: read
env:
  TEAM_ID: P8TDPVJAT8
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Comprobar secretos
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$K" ] && [ -n "$I" ] && [ -n "$P" ] || { echo "::error::Faltan los secretos ASC_KEY_ID, ASC_ISSUER_ID o ASC_KEY_P8 (ver tiendas/ios/LEEME.md)."; exit 1; }
      - name: Versión y número de compilación
        id: v
        env:
          MANUAL: ${{ github.event.inputs.build }}
        run: |
          VER=$(grep -o "APP_VERSION = '[0-9.]*'" hierro-pwa/index.html | head -1 | grep -o "[0-9.]*")
          [ -n "$VER" ] || { echo "::error::No encuentro APP_VERSION"; exit 1; }
          if [ -n "$MANUAL" ]; then
            [[ "$MANUAL" =~ ^[0-9]+$ ]] || { echo "::error::El número de compilación tiene que ser un entero"; exit 1; }
            BUILD="$MANUAL"
          else
            BUILD=$((100 + GITHUB_RUN_NUMBER))
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"; echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Versión $VER ($BUILD)"
      - name: Preparar el proyecto
        working-directory: tiendas/ios
        run: bash preparar.sh
      - name: Clave de la API
        env:
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          F="$RUNNER_TEMP/asc.p8"
          # Acepta el .p8 tal cual, el .p8 en base64 o solo el cuerpo (sin las líneas BEGIN/END)
          printf '%s\n' "$P" | tr -d '\r' > "$F"
          if ! grep -q 'BEGIN PRIVATE KEY' "$F"; then
            if printf '%s' "$P" | tr -d ' \r\n' | base64 -D 2>/dev/null | grep -q 'BEGIN PRIVATE KEY'; then
              printf '%s' "$P" | tr -d ' \r\n' | base64 -D > "$F"
            else
              B=$(printf '%s' "$P" | tr -d ' \r\n' | sed 's/-----[A-Z ]*-----//g')
              { echo '-----BEGIN PRIVATE KEY-----'; printf '%s\n' "$B" | fold -w 64; echo '-----END PRIVATE KEY-----'; } > "$F"
            fi
          fi
          if ! openssl pkey -in "$F" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 no es una clave .p8 válida (${#P} caracteres; líneas con guiones: $(printf '%s' "$P" | grep -c -- '-----')). Pega el contenido entero del archivo AuthKey_U85TUDM496.p8."
            exit 1
          fi
      # Se archiva con firma local (ad hoc, conserva los entitlements de Salud) porque la firma automática de desarrollo
      # necesita un dispositivo registrado; al exportar, Xcode vuelve a firmar con el certificado de distribución de Apple.
      - name: Archivar (firma local)
        working-directory: tiendas/ios/ios/App
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          if [ -d App.xcworkspace ]; then DEST=(-workspace App.xcworkspace); else DEST=(-project App.xcodeproj); fi
          xcodebuild "${DEST[@]}" -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hierro.xcarchive" -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER="" PROVISIONING_PROFILE="" \
            MARKETING_VERSION="${{ steps.v.outputs.ver }}" CURRENT_PROJECT_VERSION="${{ steps.v.outputs.build }}" \
            archive | tee "$RUNNER_TEMP/archive.log" | tail -n 60
      - name: Exportar firmado (.ipa)
        timeout-minutes: 15
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>destination</key><string>export</string>' \
            "<key>teamID</key><string>${TEAM_ID}</string>" \
            '<key>signingStyle</key><string>automatic</string>' \
            '<key>uploadSymbols</key><true/>' \
            '<key>manageAppVersionAndBuildNumber</key><false/>' \
            '</dict></plist>' > "$RUNNER_TEMP/export.plist"
          plutil -lint "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Hierro.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            | tee "$RUNNER_TEMP/export.log" | tail -n 60
          ls -la "$RUNNER_TEMP/export"
      # Subida aparte con altool (la subida dentro de -exportArchive se quedó colgada en «Sending SPI analysis»)
      - name: Subir a App Store Connect
        timeout-minutes: 20
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/asc.p8" ~/.appstoreconnect/private_keys/AuthKey_${KID}.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          [ -n "$IPA" ] || { echo "::error::No se ha generado el .ipa"; exit 1; }
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KID" --apiIssuer "$ISS" --output-format normal 2>&1 | tee "$RUNNER_TEMP/upload.log"
          grep -qiE 'No errors uploading|UPLOAD SUCCEEDED|successfully uploaded' "$RUNNER_TEMP/upload.log" || { echo "::error::La subida no confirmó éxito (ver el log)"; exit 1; }
      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" ~/.appstoreconnect/private_keys/*.p8
      - name: Resumen
        if: success()
        run: |
          {
            echo "### Hierro iOS ${{ steps.v.outputs.ver }} (${{ steps.v.outputs.build }}) subida a App Store Connect"
            echo "Aparecerá en TestFlight en unos 10-30 minutos, cuando Apple termine de procesarla."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hierro-ios-testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/upload.log
          retention-days: 7
