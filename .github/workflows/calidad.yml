name: Calidad
on:
  push:
    paths: ['hierro-pwa/**', 'herramientas/**', '.github/workflows/calidad.yml']
  pull_request:
  workflow_dispatch:
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --prefix herramientas acorn acorn-walk
      - run: node herramientas/calidad.mjs
