<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<script>
/* Tema (Automático / Claro / Oscuro): se fija antes de pintar para que no haya parpadeo, tampoco en la pantalla de entrada */
(function(){var p='auto',d=document.documentElement;try{p=localStorage.getItem('hierro-theme')||'auto';}catch(e){}
var t=p==='light'||p==='dark'?p:(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
d.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='light'?'#E8EDFA':'#070B1A';})();
</script>
<meta name="description" content="Registra tus entrenos de gimnasio: rutinas, series, chiquipuntos y progreso. Tus datos se quedan en tu móvil.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hierro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Hierro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
<style>
/* «Aurora» (oscuro) y «Glaciar» (claro): cristal translúcido sobre luces de aurora, degradado azul → violeta → rosa.
   Columna móvil (máx. 560px), pestañas flotantes abajo; el entreno activo es una hoja a pantalla completa.
   Los colores viven en variables bajo :root[data-theme="dark"|"light"]; el tema lo fija un script al inicio del <head>. */
:root{
  --rotulo:'Sora','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cuerpo:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-xl:28px; --r-l:24px; --r-m:16px; --r-s:10px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
/* Aurora (oscuro). También es el valor por defecto si el script del <head> no llegara a ejecutarse. */
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --fondo:#070B1A; --elev:#121836; --elev-2:#1A2142; --sheet:rgba(18,24,54,.9);
  --sup:rgba(255,255,255,.06); --sup-2:rgba(255,255,255,.08); --sup-3:rgba(255,255,255,.14); --sup-solid:#131830;
  --linea:rgba(255,255,255,.10);
  --texto:#F2F4FF; --apagado:#A9B0CC; --tenue:#7C86AD; --ph:#8E97BA;
  --tiza:#F2F4FF; --tiza-tinta:#0B1030; --foco:#A9C0FF;
  --acc:#5B8CFF; --acc-t:#9DB6FF; --acc-soft:rgba(91,140,255,.20); --violeta:#A86BFF; --violeta-t:#C9A5FF; --rosa:#FF6FB1;
  --c1:#41548F; --c2:#5B8CFF; --c3:#A86BFF; --c4:#FF6FB1; --c5:#FFB3D6;
  --pr:#FFB3D6; --pr-soft:rgba(255,179,214,.16); --pr-borde:rgba(255,179,214,.34);
  --ok:#8FE3C8; --ok-t:#8FE3C8; --ok-soft:rgba(143,227,200,.16);
  --aviso:#FFC266; --aviso-t:#FFC266;
  --frio:#7FC8FF; --peligro:#FF6B81;
  --ascua:var(--acc); --ascua-tinta:#fff;
  --grad:linear-gradient(90deg,#5B8CFF,#A86BFF 55%,#FF6FB1);
  --grad-d:linear-gradient(135deg,#5B8CFF,#B06BFF);
  --forja:var(--grad);
  --g1:#5B8CFF; --g2:#A86BFF; --g3:#FF6FB1;
  --glass:rgba(255,255,255,.07); --glass-borde:rgba(255,255,255,.12); --glass-bar:rgba(20,26,54,.74);
  --field:rgba(255,255,255,.06); --field-borde:rgba(255,255,255,.14); --field-modal:#1A2142;
  --sel-tint:rgba(120,140,255,.15); --track:rgba(255,255,255,.10); --ring-in:#10162F; --band:rgba(255,255,255,.14);
  --bar:rgba(169,176,204,.30); --dot:rgba(255,255,255,.08); --dot-fut:rgba(255,255,255,.05);
  --glow:rgba(120,110,255,.45); --btn-txt-sh:0 1px 2px rgba(7,11,26,.4);
  --sombra:none; --sombra-hero:none;
  --sombra-bar:0 14px 34px rgba(0,0,0,.40);
  --sombra-flot:0 18px 40px rgba(0,0,0,.50),0 0 0 1px rgba(255,255,255,.08);
  --scrim:rgba(4,6,16,.66);
  --aurora:radial-gradient(380px 380px at 0% 0%,rgba(91,140,255,.44),transparent 72%),radial-gradient(360px 360px at 100% 36%,rgba(176,107,255,.32),transparent 72%),radial-gradient(330px 330px at 18% 100%,rgba(255,111,177,.20),transparent 72%);
}
/* Glaciar (claro) */
:root[data-theme="light"]{
  color-scheme:light;
  --fondo:#E8EDFA; --elev:#F7F9FF; --elev-2:#FFFFFF; --sheet:rgba(247,249,255,.92);
  --sup:rgba(255,255,255,.58); --sup-2:rgba(14,22,48,.06); --sup-3:rgba(14,22,48,.10); --sup-solid:#F3F6FD;
  --linea:rgba(14,22,48,.10);
  --texto:#0E1630; --apagado:#4A5578; --tenue:#7A84A6; --ph:#66708F;
  --tiza:#0E1630; --tiza-tinta:#FFFFFF; --foco:#3D5BFF;
  --acc:#3D5BFF; --acc-t:#2F49E0; --acc-soft:rgba(61,91,255,.10); --violeta:#8A5CFF; --violeta-t:#6B3FE6; --rosa:#E0408F;
  --c1:#9DB0EE; --c2:#3D5BFF; --c3:#8A5CFF; --c4:#E0408F; --c5:#C42B78;
  --pr:#C42B78; --pr-soft:rgba(196,43,120,.10); --pr-borde:rgba(196,43,120,.30);
  --ok:#0E9F77; --ok-t:#0A7A5B; --ok-soft:rgba(14,159,119,.12);
  --aviso:#F0A52B; --aviso-t:#9A5A00;
  --frio:#0E6FA8; --peligro:#C7324E;
  --g1:#3D5BFF; --g2:#8A5CFF; --g3:#E0408F;
  --grad:linear-gradient(90deg,#3D5BFF,#8A5CFF);
  --grad-d:linear-gradient(135deg,#3D5BFF,#8A5CFF);
  --glass:rgba(255,255,255,.58); --glass-borde:rgba(255,255,255,.9); --glass-bar:rgba(255,255,255,.74);
  --field:#FFFFFF; --field-borde:#CCD4EC; --field-modal:#FFFFFF;
  --sel-tint:rgba(61,91,255,.09); --track:rgba(14,22,48,.09); --ring-in:#F4F6FD; --band:rgba(14,22,48,.12);
  --bar:rgba(61,91,255,.26); --dot:rgba(14,22,48,.06); --dot-fut:rgba(14,22,48,.035);
  --glow:rgba(61,91,255,.38); --btn-txt-sh:none;
  --sombra:0 14px 34px -10px rgba(40,60,140,.24); --sombra-hero:0 20px 50px rgba(40,60,140,.14);
  --sombra-bar:0 14px 34px rgba(40,60,140,.16);
  --sombra-flot:0 18px 44px rgba(40,60,140,.26),0 0 0 1px rgba(255,255,255,.7);
  --scrim:rgba(14,22,48,.36);
  --aurora:radial-gradient(400px 400px at 0% 0%,rgba(143,176,255,.80),transparent 72%),radial-gradient(380px 380px at 100% 36%,rgba(201,168,255,.70),transparent 72%),radial-gradient(340px 340px at 12% 100%,rgba(255,196,225,.70),transparent 72%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{background-color:var(--fondo);background-image:var(--aurora);background-repeat:no-repeat}
body{background:transparent;color:var(--texto);font-family:var(--cuerpo);font-size:16px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}
/* iPhone en claro: la barra de estado de la app instalada tiene letras blancas siempre; le ponemos detrás una franja oscura para que se lea */
html.ios-pwa[data-theme="light"] body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:#0E1630;z-index:100;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
input,select,textarea{background:var(--field);border:0;box-shadow:inset 0 0 0 1.5px var(--field-borde);border-radius:14px;padding:12px 14px;width:100%;min-height:48px}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
input[type=checkbox]{min-height:0;width:22px;height:22px;padding:0;accent-color:var(--acc);flex:none;box-shadow:none}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--ph)}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--rotulo);font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.02em}
h2{font-family:var(--rotulo);font-weight:700;font-size:20px;line-height:1.25;letter-spacing:-.02em}
h3{font-family:var(--rotulo);font-size:16.5px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--apagado)}
.small{font-size:13.5px}

#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
/* iPhone con la app instalada: iOS a veces da un alto de pantalla recortado (sin la barra de estado) y el menú queda flotando. Usamos el alto real. */
html.ios-pwa,html.ios-pwa body{height:var(--apph,100vh)}
html.ios-pwa #app{bottom:auto;height:var(--apph,100vh)}
html.ios-pwa .layer,html.ios-pwa #modal{bottom:auto;height:var(--apph,100vh)}
html.ios-pwa #rest{bottom:auto;top:calc(var(--apph,100vh) - 14px - var(--sab));transform:translate(-50%,-100%)}
#top{padding:calc(8px + var(--sat)) 16px 6px;display:flex;align-items:center;gap:8px;min-height:60px;position:relative;z-index:3;background:transparent}
#top .t{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
#top.sub{padding-left:6px}
#top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand{display:flex;align-items:center;gap:10px}
#top .brand svg{width:34px;height:34px}
#top .brand h1{font-weight:800;font-size:25px}
#top .acts{gap:2px}
.sync{font-size:12.5px;font-weight:700;color:var(--apagado);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--tenue);display:inline-block}
.sync.ok i{background:var(--ok)}
.sync.busy i{background:var(--violeta);animation:late 1.2s ease-in-out infinite}
.sync.off i{background:var(--frio)}
#top.sub .sync span,#top.compact .sync span{display:none}
@keyframes late{50%{opacity:.35}}
/* el contenido se desvanece al pasar bajo la cabecera */
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 28px;display:flex;flex-direction:column;gap:14px;-webkit-mask-image:linear-gradient(transparent 0,#000 12px);mask-image:linear-gradient(transparent 0,#000 12px)}
#view>*{flex:none}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);margin:2px 14px calc(10px + var(--sab));padding:6px;border-radius:28px;background:var(--glass-bar);border:1px solid var(--glass-borde);box-shadow:var(--sombra-bar);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);position:relative;z-index:3}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:56px;font-size:10.5px;font-weight:700;color:var(--apagado);position:relative}
#tabs .ti{display:flex;align-items:center;justify-content:center;width:48px;height:32px;border-radius:16px;transition:background .2s}
#tabs svg{width:23px;height:23px}
#tabs button[aria-current="page"]{color:var(--texto)}
#tabs button[aria-current="page"] .ti{background:var(--grad-d);color:#fff;box-shadow:0 8px 20px -6px var(--glow)}
:root[data-theme="light"] #tabs button[aria-current="page"]{color:var(--acc)}
:root[data-theme="light"] #tabs button[aria-current="page"] .ti{background:none;color:var(--acc);box-shadow:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:var(--r-m);padding:8px 18px;font-weight:700;background:var(--sup-2);color:var(--texto);text-align:center;line-height:1.2}
.card .btn:not(.primary):not(.good):not(.ghost),#modal .btn:not(.primary):not(.good):not(.ghost),.excard .btn:not(.primary):not(.ghost){background:var(--sup-3)}
.btn.primary,.btn.good{background:var(--grad);color:#fff;font-family:var(--rotulo);letter-spacing:-.01em;box-shadow:0 10px 28px -6px var(--glow);text-shadow:var(--btn-txt-sh)}
.btn.ghost{background:none;color:var(--apagado);padding:8px 10px;min-height:44px}
.btn.danger{color:var(--peligro)}
.btn.block{width:100%}
.btn.lg{min-height:56px;font-size:17px;border-radius:18px}
.btn.sm{min-height:44px;padding:6px 14px;font-size:14.5px;border-radius:12px;white-space:nowrap}
.btn.dashed{background:none;border:1.5px dashed var(--sup-3);color:var(--apagado)}
.grid2 .btn{padding:8px 10px;font-size:15px}
.btn:disabled{opacity:.4}
.btn svg{width:20px;height:20px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--texto);flex:none;position:relative}
.iconbtn:active{background:var(--sup-2)}
.iconbtn:disabled{opacity:.3}
.iconbtn svg{width:24px;height:24px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--sup);border:1px solid var(--glass-borde);border-radius:var(--r-l);padding:16px;box-shadow:var(--sombra)}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block}
.card.tap.stack,.card.tap.wcard{display:flex}
.card.tap.row{display:flex}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.chip{display:inline-flex;align-items:center;min-height:44px;background:var(--sup-2);border-radius:999px;padding:0 15px;font-size:14.5px;font-weight:700;white-space:nowrap;color:var(--apagado);flex:none}
.card .chip{background:var(--sup-2)}
.chip[aria-pressed="true"]{background:var(--tiza);color:var(--tiza-tinta)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.card .chips{margin:0;padding-left:0;padding-right:0}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;min-height:24px;padding:2px 10px;border-radius:999px;background:var(--sup-2);color:var(--apagado);white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.accent,.pill.good{background:var(--acc-soft);color:var(--acc-t)}
.pill.gold{background:var(--pr-soft);color:var(--pr)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat b{font-family:var(--rotulo);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--apagado)}
.stat b.pr{color:var(--pr)}
.empty{text-align:center;padding:32px 12px;color:var(--apagado);display:flex;flex-direction:column;gap:14px;align-items:center}
.empty h3{color:var(--texto);font-family:var(--rotulo);font-weight:700;font-size:22px;line-height:1.3}

/* inicio */
.toca{background:var(--glass);border:1px solid var(--glass-borde);color:var(--texto);border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sombra-hero)}
.toca .sub{font-size:12.5px;font-weight:700;color:var(--acc-t)}
.toca .top{display:flex;align-items:center;gap:16px}
.toca .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.toca h2{font-size:32px;font-weight:800;line-height:1.08;letter-spacing:-.03em;overflow-wrap:anywhere}
.toca .meta{font-size:13px;color:var(--apagado)}
.toca .ej{font-size:13.5px;color:var(--apagado);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toca .mp{display:flex;gap:6px;flex-wrap:wrap}
.toca .mp span{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--sup-2);color:var(--texto)}
.wring{width:92px;height:92px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--acc),var(--violeta) calc(var(--p)*1%),var(--track) 0)}
.wring div{width:74px;height:74px;border-radius:50%;background:var(--ring-in);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.wring b{font-family:var(--rotulo);font-weight:800;font-size:23px;line-height:1;letter-spacing:-.02em}
.wring small{font-size:11px;font-weight:600;color:var(--apagado);line-height:1}
.wcard{display:flex;flex-direction:column;gap:12px}
.wcard h3{font-size:18px}
.ex-lines{display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.ex-lines span{display:flex;gap:8px}
.ex-lines span b{font-variant-numeric:tabular-nums;color:var(--apagado);font-weight:700;min-width:28px;flex:none}
.ex-lines em{font-style:normal;margin-left:auto;color:var(--apagado);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px}
.wk i{width:34px;height:34px;border-radius:50%;background:var(--dot);display:flex;align-items:center;justify-content:center;color:#fff;box-sizing:border-box}
.wk i svg{width:16px;height:16px}
.wk .fut i{background:var(--dot-fut)}
.wk .on i{background:var(--grad-d);box-shadow:0 6px 14px -5px var(--glow)}
.wk .today i{background:transparent;box-shadow:inset 0 0 0 2px var(--tiza)}
.wk .today.on i{background:var(--grad-d);box-shadow:0 0 0 2px var(--sup-solid),0 0 0 4px var(--acc)}
.wk span{font-size:12px;font-weight:600;color:var(--apagado)}
.wk .today span{font-weight:800;color:var(--texto)}
.next{box-shadow:inset 0 0 0 1.5px var(--acc)}
.mlist{display:flex;flex-direction:column;gap:7px;flex:1;font-size:14.5px;min-width:0}
.mlist div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mlist i{width:9px;height:9px;border-radius:50%;flex:none}
.mlist span{flex:1;color:var(--apagado)}
.linkbtn{font-size:13.5px;font-weight:700;color:var(--acc-t);min-height:44px;margin:-8px 0}

/* lista de ejercicios */
.exlist{display:flex;flex-direction:column}
.exitem{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--linea);text-align:left;width:100%;min-height:60px}
.exitem .mono{width:42px;height:42px;border-radius:14px;background:var(--sup-2);background:color-mix(in srgb,var(--mt,var(--apagado)) 15%,var(--sup-2));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--mt,var(--apagado));flex:none;font-size:13.5px;letter-spacing:.02em}
.exitem .nm{flex:1;min-width:0}
.exitem .mono{position:relative;overflow:hidden;width:52px;height:52px}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff;border-radius:inherit}
.exthumb{position:relative;width:44px;height:44px;border-radius:14px;overflow:hidden;flex:none;background:var(--sup-2)}
.exhero{position:relative;width:100%;aspect-ratio:4/3;max-height:300px;border-radius:var(--r-l);overflow:hidden;background:#fff}
.exhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.exhero img.f1{animation:exmove 2.4s steps(1,end) infinite}
@keyframes exmove{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.exhero img.f1{animation:none;opacity:0}}
.exhero small{position:absolute;left:10px;bottom:8px;font-size:11px;color:#555;background:rgba(255,255,255,.85);padding:2px 7px;border-radius:999px}
.exitem .nm div:first-child{font-weight:700}
.exitem.sel{background:var(--sel-tint);border-radius:16px;border-bottom-color:transparent}
.exitem.sel .mono{background:var(--grad-d);color:#fff}

function heat(t, theme){

  if (!(kg >= 20)) return null;

  for (const [p] of PLATES) while (side - p >= -1e-9 && list.length < 14) { list.push(p); side -= p; sum += p; }

function photoId(x){
  if (!x) return null;
  if (photoCache.has(x.id)) return photoCache.get(x.id);
  let id = PHOTO.get(norm(x.name)) || null;
  if (!id) { /* ejercicio propio o importado de Hevy: busca el más parecido de la biblioteca */
    const a = photoTokens(x.name); let best = 0;
    if (a.size) PHOTO.forEach((pid, n) => { const b = photoTokens(n); let k = 0; b.forEach(t => { if (a.has(t)) k++; }); const j = k / (a.size + b.size - k); if (j > best && j >= .5) { best = j; id = pid; } });
  }
  photoCache.set(x.id, id); return id;
}

const KV = {
  db: null,
  open(){ return new Promise(res => { try { const r = indexedDB.open('hierro', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => res(null); r.onblocked = () => res(null); } catch (e) { res(null); } }); },
  get(k){ return new Promise(res => {
    if (!this.db) { try { const v = localStorage.getItem('hierro.' + k); res(v ? JSON.parse(v) : null); } catch (e) { res(null); } return; }
    try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); } catch (e) { res(null); }
  }); },
  set(k, v){ return new Promise(res => {
    if (!this.db) { try { localStorage.setItem('hierro.' + k, JSON.stringify(v)); res(true); } catch (e) { res(false); } return; }
    try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false); } catch (e) { res(false); }
  }); },
  del(k){ return new Promise(res => {
    if (!this.db) { try { localStorage.removeItem('hierro.' + k); } catch (e) {} res(true); return; }
    try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); }
  }); }
};
function hash(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
}

  },

    S.workouts = Array.isArray(d.workouts) ? d.workouts : [];

const Sync = {

  async push(){

    if (d.active) items.push([Cloud.write(['users', uid, 'state', 'active'], {json: S.active || null}), () => { Store.synced.active = d.active; }]);
    d.w.forEach(([w, h]) => items.push([Cloud.write(['users', uid, 'workouts', w.id], {json: w, start: w.start, deleted: false}), () => { Store.synced.w[w.id] = h; }]));

    for (let i = 0; i < items.length; i += 400) {
      const chunk = items.slice(i, i + 400);
      await Cloud.commit(chunk.map(x => x[0]));
      chunk.forEach(x => x[1]());
      await Store.save();
    }
    // perfil público y entrenos publicados (si falla, no bloquea tus datos privados)
    const sitems = Social.pushItems();
    for (let i = 0; i < sitems.length; i += 200) {
      const chunk = sitems.slice(i, i + 200);

    }

      const remote = parse(a), lh = hashOf(S.active || null);
      if (remote !== undefined && (Store.synced.active == null || lh === Store.synced.active)) {
        if (hashOf(remote || null) !== lh) { S.active = remote || null; changed = true; }

    }
    const q = {from: [{collectionId: 'workouts'}]};
    if (Store.lastPull) q.where = {fieldFilter: {field: {fieldPath: 'srv'}, op: 'GREATER_THAN', value: {timestampValue: Store.lastPull}}};

/* =========================================================
   Cálculos: volumen, anteriores, chiquipuntos

const isWork = s => s.t !== 'w';
function setVol(s){ return (s.kg || 0) * (s.reps || 0); }

function hasData(s, type){
  if (type === 'dur') return s.sec > 0;
  if (type === 'cardio') return s.km > 0 || s.min > 0;
  return s.reps > 0;
}
function exHistory(exId, beforeTs = Infinity, excludeId = null){
  const out = [];
  for (const w of S.workouts) {
    if (w.start >= beforeTs || w.id === excludeId) continue;
    const blocks = w.exercises.filter(e => e.exId === exId);
    if (blocks.length) out.push({w, sets: blocks.flatMap(b => b.sets)});
  }
  return out; // ya ordenado desc
}

function bestsOf(exId, beforeTs, excludeId){
  const b = {kg: 0, e1rm: 0, vol: 0, reps: 0, sec: 0, km: 0, sessVol: 0};
  for (const {sets} of exHistory(exId, beforeTs, excludeId)) {
    let sv = 0;
    for (const s of sets) { if (!isWork(s)) continue; b.kg = Math.max(b.kg, s.kg || 0); b.e1rm = Math.max(b.e1rm, e1rm(s)); b.vol = Math.max(b.vol, setVol(s)); b.reps = Math.max(b.reps, s.reps || 0); b.sec = Math.max(b.sec, s.sec || 0); b.km = Math.max(b.km, s.km || 0); sv += setVol(s); }
    b.sessVol = Math.max(b.sessVol, sv);
  }
  return b;
}
function computePRs(w){
  const prs = [];
  for (const e of w.exercises) {
    const type = exOf(e.exId).type;
    const old = bestsOf(e.exId, w.start, w.id);
    const hadHistory = exHistory(e.exId, w.start, w.id).length > 0;
    if (!hadHistory) continue; // primera vez: no cuenta como chiquipunto
    const work = e.sets.filter(isWork);
    const cur = {kg: 0, e1rm: 0, vol: 0, reps: 0, sec: 0, km: 0};
    work.forEach(s => { cur.kg = Math.max(cur.kg, s.kg || 0); cur.e1rm = Math.max(cur.e1rm, e1rm(s)); cur.vol = Math.max(cur.vol, setVol(s)); cur.reps = Math.max(cur.reps, s.reps || 0); cur.sec = Math.max(cur.sec, s.sec || 0); cur.km = Math.max(cur.km, s.km || 0); });
    const add = (kind, label, val, txt, prev) => prs.push({exId: e.exId, kind, label, val, txt, prev});
    if (type === 'wr' || (type === 'bw' && cur.kg > 0)) {
      if (cur.kg > old.kg) add('kg', 'Peso más alto', cur.kg, fmtN(cur.kg) + ' kg', old.kg ? fmtN(old.kg) + ' kg' : '');
      if (cur.e1rm > old.e1rm + 0.01) add('e1rm', '1RM estimado', cur.e1rm, fmtN(cur.e1rm) + ' kg', old.e1rm ? fmtN(old.e1rm) + ' kg' : '');
      if (cur.vol > old.vol) add('vol', 'Mejor serie (volumen)', cur.vol, fmtN(cur.vol, 0) + ' kg', old.vol ? fmtN(old.vol, 0) + ' kg' : '');
    }
    if (type === 'bw' && cur.reps > old.reps) add('reps', 'Más repeticiones', cur.reps, cur.reps + ' reps', old.reps ? old.reps + ' reps' : '');
    if (type === 'dur' && cur.sec > old.sec) add('sec', 'Más tiempo', cur.sec, fmtClock(cur.sec), old.sec ? fmtClock(old.sec) : '');
    if (type === 'cardio' && cur.km > old.km) add('km', 'Más distancia', cur.km, fmtN(cur.km, 2) + ' km', old.km ? fmtN(old.km, 2) + ' km' : '');
  }
  return prs;
}
// Chiquipunto de una serie concreta, al momento de marcarla (compara con el historial y con las series anteriores de hoy)
function setPR(d, ei, si, cache){
  const e = d.exercises[ei], s = e.sets[si]; if (!s || !s.done || !isWork(s)) return null;
  const type = exOf(e.exId).type;
  let base = cache && cache[e.exId];
  if (!base) { base = exHistory(e.exId, d.start, d.id).length ? bestsOf(e.exId, d.start, d.id) : false; if (cache) cache[e.exId] = base; }
  if (!base) return null; // primera vez: no cuenta
  const b = Object.assign({}, base);
  d.exercises.forEach((x, i) => { if (x.exId !== e.exId) return; x.sets.forEach((q, j) => { if (!(i < ei || (i === ei && j < si)) || !q.done || !isWork(q)) return; b.kg = Math.max(b.kg, q.kg || 0); b.e1rm = Math.max(b.e1rm, e1rm(q)); b.vol = Math.max(b.vol, setVol(q)); b.reps = Math.max(b.reps, q.reps || 0); b.sec = Math.max(b.sec, q.sec || 0); b.km = Math.max(b.km, q.km || 0); }); });
  if (type === 'wr' || (type === 'bw' && s.kg > 0)) {
    if ((s.kg || 0) > b.kg) return {label: 'Peso más alto', txt: fmtN(s.kg) + ' kg'};
    if (e1rm(s) > b.e1rm + 0.01) return {label: '1RM estimado', txt: fmtN(e1rm(s)) + ' kg'};
    if (setVol(s) > b.vol) return {label: 'Mejor serie', txt: fmtN(setVol(s), 0) + ' kg'};
  }
  if (type === 'bw' && (s.reps || 0) > b.reps) return {label: 'Más repeticiones', txt: s.reps + ' reps'};
  if (type === 'dur' && (s.sec || 0) > b.sec) return {label: 'Más tiempo', txt: fmtClock(s.sec)};
  if (type === 'cardio' && (s.km || 0) > b.km) return {label: 'Más distancia', txt: fmtN(s.km, 2) + ' km'};

}
function setText(s, type){
  if (!s) return '';
  if (type === 'dur') return s.sec ? fmtClock(s.sec) : '';
  if (type === 'cardio') return [s.km ? fmtN(s.km, 2) + ' km' : '', s.min ? fmtN(s.min) + ' min' : ''].filter(Boolean).join(' · ');
  if (type === 'bw') return (s.kg ? '+' + fmtN(s.kg) + ' kg × ' : '× ') + (s.reps ?? '');

/* =========================================================

const DAY_NAMES = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const PLAN_GOALS = {

}
const planRoutine = (p, i) => p && p.days[i] ? S.routines.find(r => r.id === p.days[i]) || null : null;
function planToday(){
  const p = plan(); if (!p) return null;

function routineSets(r){ const m = {}; r.exercises.forEach(e => { const k = exOf(e.exId).muscle, n = (e.sets || []).filter(isWork).length; if (n) m[k] = (m[k] || 0) + n; }); return m; }
const effSets = (ms, k) => (ms[k] || 0) + (PLAN_INDIRECT[k] || []).reduce((a, [o, f]) => a + (ms[o] || 0) * f, 0);

  const freq = {}; perDay.forEach(m => Object.entries(m).forEach(([k, v]) => { if (v >= 2) freq[k] = (freq[k] || 0) + 1; }));

  const W = 320, H = 270, cx = 160, cy = 132, R = 92, n = GROUPS.length;

  const rings = [0.25, 0.5, 0.75, 1].map(f => `<polygon points="${GROUPS.map((_, i) => pt(i, max * f).join(',')).join(' ')}" fill="none" stroke="var(--linea)"/>`).join('');
  const spokes = GROUPS.map((_, i) => { const [x, y] = pt(i, max); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--linea)"/>`; }).join('');
  const labels = GROUPS.map(([g], i) => { const [x, y] = pt(i, max * 1.2); const anchor = Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end'; return `<text x="${x}" y="${y + 3}" text-anchor="${anchor}" class="lbl">${g}</text><text x="${x}" y="${y + 15}" text-anchor="${anchor}">${cur[i]} series</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reparto muscular">${rings}${spokes}

function streakGrid(weeks = 26){
  const end = weekStart(Date.now()), start = end - (weeks - 1) * 7 * 864e5;
  const days = new Map();
  const vols = new Map(); S.workouts.forEach(w => { const d = new Date(w.start); d.setHours(0, 0, 0, 0); days.set(d.getTime(), (days.get(d.getTime()) || 0) + 1); vols.set(d.getTime(), (vols.get(d.getTime()) || 0) + wVolume(w)); });
  const vmax = Math.max(0, ...[...vols].filter(([t]) => t >= start).map(([, v]) => v));
  const cs = 11, gap = 3, W = weeks * (cs + gap) + 22, H = 7 * (cs + gap) + 16;
  let cells = '', months = '', lastM = -1, n = 0;
  for (let i = 0; i < weeks; i++) {
    const wk = start + i * 7 * 864e5, md = new Date(wk);
    if (md.getMonth() !== lastM) { lastM = md.getMonth(); if (i < weeks - 2) months += `<text x="${22 + i * (cs + gap)}" y="9">${MON3[lastM]}</text>`; }
    for (let d = 0; d < 7; d++) {
      const day = new Date(wk); day.setDate(day.getDate() + d); day.setHours(0, 0, 0, 0);
      const t = day.getTime(); if (t > Date.now()) continue;

      cells += `<rect x="${22 + i * (cs + gap)}" y="${14 + d * (cs + gap)}" width="${cs}" height="${cs}" rx="3" fill="${c ? heat(vmax ? .28 + .72 * (vols.get(t) || 0) / vmax : .55) : 'var(--dot)'}"/>`;

}

function exUseCount(){ const c = {}; S.workouts.forEach(w => w.exercises.forEach(e => c[e.exId] = (c[e.exId] || 0) + 1)); return c; }
function exFilter(q, m){
  const nq = norm(q);
  return allEx().filter(e => (!m || e.muscle === m) && (!nq || norm(e.name + ' ' + e.aliases.join(' ') + ' ' + (MUSCLES[e.muscle] || '')).includes(nq)));
}
function exItem(e, count, sel){

}
function exChips(sel, act){

}
function viewExercises(){

function exListHTML(){

function recordsOf(id){
  const x = exOf(id), R = {};
  const put = (k, v, w, extra) => { if (v > 0 && (!R[k] || v > R[k].v)) R[k] = {v, w, ...extra}; };
  const reps = {};
  for (const {w, sets} of exHistory(id)) {
    let sv = 0;
    for (const s of sets) {
      if (!isWork(s)) continue;
      put('kg', s.kg || 0, w, {s}); put('e1rm', e1rm(s), w, {s}); put('vol', setVol(s), w, {s}); put('reps', s.reps || 0, w, {s});
      put('sec', s.sec || 0, w); put('km', s.km || 0, w); sv += setVol(s);
      if ((x.type === 'wr' || x.type === 'bw') && s.reps && (x.type === 'bw' || s.kg)) { const r = s.reps; if (!reps[r] || (s.kg || 0) > reps[r].kg) reps[r] = {kg: s.kg || 0, w}; }
    }
    put('sess', sv, w);
  }

/* ---------- Estadísticas ---------- */
function viewStats(){
  const R = UI.stRange, now = Date.now(), days = {'30d': 30, '3m': 91, '1y': 365}[R];
  const first = S.workouts.length ? S.workouts[S.workouts.length - 1].start : now;
  const from = days ? now - days * 864e5 : first, prevFrom = days ? from - days * 864e5 : null;
  const cur = inRange(from, now + 1), prev = days ? inRange(prevFrom, from) : [];
  const a = agg(cur), p = days && prev.length ? agg(prev) : null;
  const rl = {'30d': '30 días', '3m': '3 meses', '1y': 'año'}[R];
  let h = `<div class="seg">${[['30d', '30 días'], ['3m', '3 meses'], ['1y', '1 año'], ['all', 'Todo']].map(([k, l]) => `<button data-act="st-range" data-k="${k}" aria-pressed="${R === k}">${l}</button>`).join('')}</div>`;
  if (!S.workouts.length) return h + '<div class="empty">Cuando registres entrenos verás aquí tus estadísticas.</div>';
  h += `<div class="card stack"><div class="stats4">${tile(a.n, 'Entrenos', delta(a.n, p && p.n))}${tile(fmtDur(a.ms), 'Tiempo', delta(a.ms, p && p.ms))}${tile(fmtKg(a.vol), 'Volumen', delta(a.vol, p && p.vol))}${tile(a.sets, 'Series', delta(a.sets, p && p.sets))}</div>
    <div class="small muted">${days ? (p ? `Comparado con ${R === '1y' ? 'el año' : 'los ' + rl} anteriores.` : 'No hay datos del periodo anterior para comparar.') : `Desde tu primer entreno, el ${fmtDate(first, false)}.`}</div></div>`;
  // evolución
  const byMonth = !days || days > 91, buckets = [];
  if (byMonth) {
    const d0 = new Date(from); let k = d0.getFullYear() * 12 + d0.getMonth(); const kEnd = new Date().getFullYear() * 12 + new Date().getMonth();
    k = Math.max(k, kEnd - 35);
    for (; k <= kEnd; k++) { const s = new Date(Math.floor(k / 12), k % 12, 1).getTime(), e = new Date(Math.floor(k / 12), k % 12 + 1, 1).getTime(); buckets.push({label: MON3[k % 12], s, e}); }
  } else {
    for (let k = weekStart(from); k <= now; k = weekStart(k + 8 * 864e5)) { const d = new Date(k); buckets.push({label: `${d.getDate()}/${d.getMonth() + 1}`, s: k, e: weekStart(k + 8 * 864e5)}); }
  }
  const M = UI.stMetric;
  const items = buckets.map(b => { const ws = inRange(b.s, b.e), g = agg(ws); return {label: b.label, v: M === 'vol' ? g.vol : M === 'dur' ? g.ms / 36e5 : M === 'sets' ? g.sets : g.n}; });
  const fmt = M === 'vol' ? (v, ax) => ax ? (v ? fmtN(v / 1000, 1) + 't' : '0') : fmtKg(v) : M === 'dur' ? (v, ax) => fmtN(v, 1) + (ax ? '' : ' h') : v => fmtN(v, 0);
  const avg = items.length ? items.reduce((s, i) => s + i.v, 0) / items.length : 0;
  h += `<div class="card stack"><h3>Evolución ${byMonth ? 'mensual' : 'semanal'}</h3><div class="seg sm">${[['vol', 'Volumen'], ['dur', 'Horas'], ['sets', 'Series'], ['n', 'Entrenos']].map(([k, l]) => `<button data-act="st-metric" data-k="${k}" aria-pressed="${M === k}">${l}</button>`).join('')}</div>${barChart(items, fmt)}<div class="small muted">Media: <b>${fmt(avg)}</b> por ${byMonth ? 'mes' : 'semana'}.</div></div>`;
  // reparto muscular
  const mc = muscleSets(cur), mp = muscleSets(prev), gc = groupSets(mc), gp = groupSets(mp), totS = gc.reduce((x, y) => x + y, 0);
  h += `<div class="card stack"><h3>Reparto muscular</h3><div class="small muted">Series efectivas por grupo${p ? '. La línea discontinua es el periodo anterior.' : '.'}</div>${radar(gc, p ? gp : null)}
    <div class="split">${GROUPS.map(([g], i) => `<div class="mbar"><span>${g}</span><div class="track">${fillBar(totS ? gc[i] / Math.max(...gc) * 100 : 0)}</div><b>${totS ? fmtN(gc[i] / totS * 100, 0) : 0}%</b></div>`).join('')}</div></div>`;
  // mapa corporal
  const ml = Object.entries(mc).sort((x, y) => y[1] - x[1]), mmax = ml.length ? ml[0][1] : 0;
  h += `<div class="card stack"><h3>Mapa muscular</h3><div class="bm-lg">${bodyMap(mc)}</div>
    ${ml.map(([k, v]) => `<div class="mbar"><span>${MUSCLES[k] || k}</span><div class="track">${fillBar(v / mmax * 100)}</div><b>${v}</b></div>${p ? `<div class="small muted" style="margin:-6px 0 0 104px">antes ${mp[k] || 0} ${delta(v, mp[k] || 0)}</div>` : ''}`).join('') || '<div class="chart-empty">Sin series en este periodo.</div>'}</div>`;
  // series por grupo en el tiempo
  const gi = Math.max(0, GROUPS.findIndex(g => g[0] === UI.stGroup));
  const wk = []; for (let k = weekStart(from); k <= now; k = weekStart(k + 8 * 864e5)) wk.push(k);
  const gpts = wk.map(k => ({x: k, y: groupSets(muscleSets(inRange(k, weekStart(k + 8 * 864e5))))[gi]}));
  h += `<div class="card stack"><h3>Series por semana</h3><div class="chips">${GROUPS.map(([g]) => `<button class="chip" data-act="st-group" data-k="${g}" aria-pressed="${GROUPS[gi][0] === g}">${g}</button>`).join('')}</div>${gpts.some(q => q.y) ? lineChart(gpts, ' series', v => fmtN(v, 0)) : '<div class="chart-empty">Sin series de este grupo en el periodo.</div>'}<div class="small muted">Una referencia habitual para ganar músculo son 10–20 series por grupo a la semana.</div></div>`;
  // ejercicios principales
  const ex = {}; cur.slice().reverse().forEach(w => w.exercises.forEach(e => { const t = exOf(e.exId).type; (ex[e.exId] = ex[e.exId] || {n: 0, sc: [], type: t}).n++; ex[e.exId].sc.push(exScore(e.sets, t)); }));
  const top = Object.entries(ex).sort((x, y) => y[1].n - x[1].n).slice(0, 8);
  h += `<div class="card stack"><h3>Ejercicios principales</h3>${top.map(([id, o]) => { const sc = o.sc.filter(v => v > 0); const f = sc[0], l = sc[sc.length - 1]; return `<button class="exrow" data-act="open-ex" data-id="${id}"><div><b>${esc(exOf(id).name)}</b><small>${o.n} ${o.n === 1 ? 'sesión' : 'sesiones'}${l ? ` · ${o.type === 'wr' ? '1RM ' : ''}${fmtN(l)}${scoreUnit(o.type)}` : ''} ${sc.length > 1 ? delta(l, f) : ''}</small></div>${spark(sc.slice(-12))}</button>`; }).join('') || '<div class="chart-empty">Sin ejercicios en este periodo.</div>'}</div>`;
  return h;
}

/* ---------- Informe mensual ---------- */
function viewMonth(ym){
  const y = Math.floor(ym / 12), m = ym % 12;
  const s = new Date(y, m, 1).getTime(), e = new Date(y, m + 1, 1).getTime(), ps = new Date(y, m - 1, 1).getTime();
  const cur = inRange(s, e), prev = inRange(ps, s), a = agg(cur), p = prev.length ? agg(prev) : null;
  const nowYm = new Date().getFullYear() * 12 + new Date().getMonth();
  let h = `<div class="row between"><button class="iconbtn" data-act="go-month" data-ym="${ym - 1}" data-replace="1" aria-label="Mes anterior">${ICON.back}</button><h2>${monthName(m)} ${y}</h2><button class="iconbtn" data-act="go-month" data-ym="${ym + 1}" data-replace="1" aria-label="Mes siguiente" style="transform:scaleX(-1)" ${ym >= nowYm ? 'disabled' : ''}>${ICON.back}</button></div>`;
  if (!cur.length) return h + `<div class="empty">No hay entrenos en ${MONTHS[m]} de ${y}.</div>`;
  h += `<div class="card stack"><div class="stats4">${tile(a.n, 'Entrenos', delta(a.n, p && p.n))}${tile(fmtDur(a.ms), 'Tiempo', delta(a.ms, p && p.ms))}${tile(fmtKg(a.vol), 'Volumen', delta(a.vol, p && p.vol))}${tile(a.sets, 'Series', delta(a.sets, p && p.sets))}</div><div class="small muted">${p ? `Comparado con ${MONTHS[(m + 11) % 12]}.` : 'Primer mes con entrenos registrados.'}${ym === nowYm ? ' El mes aún no ha terminado.' : ''}</div></div>`;
  const months = [...Array(6)].map((_, i) => { const k = ym - 5 + i, ss = new Date(Math.floor(k / 12), k % 12, 1).getTime(), ee = new Date(Math.floor(k / 12), k % 12 + 1, 1).getTime(); return {label: MON3[k % 12], v: agg(inRange(ss, ee)).vol}; });
  h += `<div class="card stack"><h3>Volumen de los últimos 6 meses</h3>${barChart(months, (v, ax) => ax ? (v ? fmtN(v / 1000, 1) + 't' : '0') : fmtKg(v))}</div>`;
  const prs = []; cur.forEach(w => (w.prs || []).forEach(pr => prs.push({...pr, w})));
  const best = {}; prs.forEach(pr => { const k = pr.exId + pr.kind; if (!best[k] || pr.val > best[k].val) best[k] = pr; });
  const prl = Object.values(best).sort((x, y2) => y2.w.start - x.w.start);
  h += `<div class="card stack"><div class="row between"><h3>Chiquipuntos del mes</h3><span class="pill gold">${prl.length}</span></div>${prl.length ? prl.slice(0, 12).map(pr => `<button class="recrow" data-act="open-workout" data-id="${pr.w.id}"><span>${esc(exOf(pr.exId).name)}<small>${pr.label} · ${fmtDate(pr.w.start, false)}</small></span><b class="pr num">${pr.txt}</b></button>`).join('') : '<div class="small muted">Este mes no hubo chiquipuntos nuevos.</div>'}</div>`;
  const nd = new Set(cur.map(w => new Date(w.start).getDate())).size;
  h += `<div class="card stack"><div class="row between"><h3>Constancia</h3><span class="small muted">${nd} días entrenados</span></div>${calHTML(y, m)}</div>`;
  const mc = muscleSets(cur), mp = muscleSets(prev);
  h += `<div class="card stack"><h3>Reparto muscular</h3><div class="small muted">${p ? `Discontinuo: ${MONTHS[(m + 11) % 12]}.` : ''}</div>${radar(groupSets(mc), p ? groupSets(mp) : null)}<div class="bm-lg">${bodyMap(mc)}</div></div>`;
  const ex = {}; cur.forEach(w => w.exercises.forEach(e2 => { ex[e2.exId] = (ex[e2.exId] || 0) + 1; }));
  const top = Object.entries(ex).sort((x, y2) => y2[1] - x[1]).slice(0, 6);
  h += `<div class="card stack"><h3>Lo que más has hecho</h3>${top.map(([id, n], i) => `<button class="exrow" data-act="open-ex" data-id="${id}"><div><b>${i + 1}. ${esc(exOf(id).name)}</b><small>${n} ${n === 1 ? 'sesión' : 'sesiones'}</small></div></button>`).join('')}</div>`;
  return h;
}

/* =========================================================
   Editor: entreno activo, rutina o entreno pasado
   ========================================================= */
let ED = null; // {mode, data, routineId}
let tickTimer = null;
function blankSet(t = 'n'){ return {t, kg: null, reps: null, sec: null, km: null, min: null, done: false}; }
function exBlock(exId, sets){ return {uid: rid(), exId, notes: '', rest: null, ss: null, sets: sets || [blankSet()]}; }
function phFor(e, si){
  // valor sugerido: objetivo de la rutina o la serie anterior equivalente
  const s = e.sets[si]; if (s.ph) return s.ph;
  const p = prevSets(e.exId, ED && ED.mode === 'past' ? ED.data.id : null);
  return p[si] || null;
}
function startWorkout(from){
  if (S.active) { openEditor('active'); toast('Ya tienes un entreno en marcha'); return; }
  const now = Date.now();
  const w = {id: rid(), title: from ? from.name || from.title : 'Entreno', start: now, notes: '', routineId: from && from.name ? from.id : null, exercises: []};
  if (from) w.exercises = from.exercises.map(e => {
    const prev = prevSets(e.exId);
    return {uid: rid(), exId: e.exId, notes: '', rest: e.rest ?? null, ss: e.ss || null, sets: e.sets.map((s, i) => {
      const hasTarget = s.kg != null || s.reps != null || s.sec != null || s.km != null;
      const ph = hasTarget ? {kg: s.kg, reps: s.reps, sec: s.sec, km: s.km, min: s.min} : (prev[i] || null);
      return {...blankSet(s.t || 'n'), ph};
    })};
  });
  S.active = w; Store.mark('active');
  openEditor('active');
  wakeLock(true);
}
function openEditor(mode, data){
  ED = {mode, data: mode === 'active' ? S.active : data};
  $('#editor').classList.add('open');
  renderEditor();
  clearInterval(tickTimer);
  if (mode === 'active') tickTimer = setInterval(tick, 1000);
  restoreActiveBar();
}
function closeEditor(){
  $('#editor').classList.remove('open'); $('#editor').innerHTML = '';
  ED = null; clearInterval(tickTimer); tickTimer = null;
  restoreActiveBar(); render();
}
function tick(){ const el = $('#edClock'); if (el && S.active) el.textContent = fmtClock((Date.now() - S.active.start) / 1000); const bar = $('#abClock'); if (bar && S.active) bar.textContent = fmtClock((Date.now() - S.active.start) / 1000); }
function edStats(){
  const d = ED.data; let vol = 0, n = 0;
  d.exercises.forEach(e => e.sets.forEach(s => { if (s.done) { n++; if (isWork(s)) vol += setVol(s); } }));
  return {vol, n};
}
function renderEditor(keepScroll = true){

    ? `<button class="iconbtn" data-act="ed-min" aria-label="Minimizar">${ICON.down}</button><div class="ttl"><span id="edClock" class="num">${fmtClock((Date.now() - d.start) / 1000)}</span><small>Entreno en curso</small></div><button class="btn good" data-act="ed-finish">Terminar</button>`
    : `<button class="btn ghost" data-act="ed-cancel">Cancelar</button><div class="ttl">${m === 'routine' ? (d._new ? 'Nueva rutina' : 'Editar rutina') : 'Editar entreno'}</div><button class="btn primary sm" data-act="ed-save">Guardar</button>`;
  const s = edStats();
  let h = `<div class="wrap"><div class="ehead">${head}</div><div class="ebody">
    <input class="titlein" id="edTitle" value="${esc(m === 'routine' ? d.name : d.title)}" placeholder="${m === 'routine' ? 'Nombre de la rutina (p. ej. Torso A)' : 'Nombre del entreno'}" aria-label="Nombre">`;

}
function platesHTML(e){
  const x = exOf(e.exId); if (!ED || ED.mode !== 'active' || x.equip !== 'barra' || x.type !== 'wr') return '';
  const si = e.sets.findIndex(q => !q.done); if (si < 0) return '';
  const kg = e.sets[si].kg ?? (phFor(e, si) || {}).kg, r = kg == null ? null : platesFor(kg); if (!r) return '';
  if (!r.list.length) return `<span>Solo la barra${r.exact ? '' : ' (20 kg)'}</span>`;
  const groups = []; r.list.forEach(p => { const g = groups[groups.length - 1]; if (g && g[0] === p) g[1]++; else groups.push([p, 1]); });
  const txt = groups.map(([p, n]) => (n > 1 ? n + '×' : '') + fmtN(p, 2)).join(' + ');
  return `<span class="pl" aria-hidden="true"><u></u>${r.list.map(p => { const [, c, hh] = PLATES.find(q => q[0] === p); return `<i style="height:${hh}px;background:${c}"></i>`; }).join('')}</span><span>${txt} por lado${r.exact ? '' : ` (${fmtN(r.total, 2)} kg)`}</span>`;
}
function exCardHTML(e, ei){
  const x = exOf(e.exId), m = ED.mode, chk = m === 'active';
  const prev = prevSets(e.exId, m === 'past' ? ED.data.id : null);

  const fields = x.type === 'dur' ? ['sec'] : x.type === 'cardio' ? ['km', 'min'] : ['kg', 'reps'];
  const rest = e.rest ?? S.settings.rest;
  let n = 0;
  if (chk && !ED.prc) ED.prc = {};
  const rows = e.sets.map((s, si) => {
    const pr = chk && s.done ? setPR(ED.data, ei, si, ED.prc) : null;
    const lab = s.t === 'n' ? ++n : s.t.toUpperCase();
    const ph = phFor(e, si) || {};
    const pv = prev[si], key = ei + '-' + si;
    const inputs = fields.map(f => `<input class="sin" inputmode="${f === 'reps' || f === 'sec' ? 'numeric' : 'decimal'}" data-act="set-in" data-f="${f}" data-ei="${ei}" data-si="${si}" value="${s[f] != null ? String(s[f]).replace('.', ',') : ''}" placeholder="${ph[f] != null ? fmtN(ph[f], 2) : '–'}" aria-label="${f} serie ${si + 1}">`).join('') + (fields.length === 1 ? '<div></div>' : '');
    return `<div class="swrap"><div class="sgrid srow t-${s.t} ${chk && s.done ? 'done' : ''} ${pr ? 'prow' : ''} ${chk ? '' : 'nochk'} ${chk && ED.cur === key ? 'cur' : ''} ${ED.just === key ? 'just' : ''}" id="r-${ei}-${si}" data-ei="${ei}" data-si="${si}">
      <button class="sbadge" data-act="set-menu" data-ei="${ei}" data-si="${si}" aria-label="Tipo de serie">${lab}${pr ? `<i class="medal" title="Chiquipunto: ${pr.label}">${ICON.trophy}</i>` : ''}</button>
      <button class="sprev" data-act="use-prev" data-ei="${ei}" data-si="${si}">${pv ? esc(setText(pv, x.type)) : '–'}</button>
      ${inputs}
      ${chk ? `<button class="schk" data-act="set-done" data-ei="${ei}" data-si="${si}" aria-label="Marcar serie hecha" aria-pressed="${!!s.done}">${ICON.check}</button>` : ''}</div></div>`;
  }).join('');
  return `<div class="excard ${e.ss ? 'ss' : ''}" id="ex-${ei}">

function parseCSV(text){
  const firstLine = text.slice(0, text.indexOf('\n') > -1 ? text.indexOf('\n') : text.length);
  const D = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === D) { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }

}

  if (m) return new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5]).getTime();

async function saveFile(filename, data, mime){

  } catch (e) { if (e && e.name === 'AbortError') return false; }

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  } catch (e) { toast('No se ha podido guardar el archivo'); return false; }

function toCSV(){
  const head = ['title','start_time','end_time','description','exercise_title','superset_id','exercise_notes','set_index','set_type','weight_kg','reps','distance_km','duration_seconds'];
  const q = v => { v = v == null ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const dt = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:00`; };
  const T = {n: 'normal', w: 'warmup', f: 'failure', d: 'dropset'};
  const lines = [head.join(',')];
  S.workouts.slice().reverse().forEach(w => w.exercises.forEach(e => e.sets.forEach((s, i) => lines.push([w.title, dt(w.start), dt(w.end), w.notes, exOf(e.exId).name, e.ss ? e.ss.replace(/^s/, '') : '', e.notes, i, T[s.t], s.kg, s.reps, s.km, s.sec != null ? s.sec : s.min != null ? Math.round(s.min * 60) : ''].map(q).join(',')))));

const fsv = v => {
  if (v === null || v === undefined) return {nullValue: null};
  if (typeof v === 'boolean') return {booleanValue: v};
  if (typeof v === 'number') return Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
  if (typeof v === 'string') return {stringValue: v};
  if (Array.isArray(v)) return {arrayValue: {values: v.map(fsv)}};
  return {mapValue: {fields: Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fsv(x)]))}};
};
const jsv = v => {
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return +v.integerValue;
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return Date.parse(v.timestampValue);
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(jsv);
  if ('mapValue' in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, jsv(x)]));
  return null;
};
const fsFields = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, fsv(v)]));
const docData = d => ({_id: d.name.split('/').pop(), _name: d.name, ...Object.fromEntries(Object.entries(d.fields || {}).map(([k, v]) => [k, jsv(v)]))});

function ago(t){
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'ahora'; if (s < 3600) return `hace ${Math.floor(s / 60)} min`; if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  if (s < 172800) return 'ayer'; if (s < 604800) return `hace ${Math.floor(s / 86400)} días`; return fmtDate(t, false);
}

async function compressPhoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    let max = 1080, q = .74, out = '';
    for (let k = 0; k < 6; k++) {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); out = c.toDataURL('image/jpeg', q);
      if (out.length < 260000) break; max = Math.round(max * .82); q = Math.max(.5, q - .06);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

  'w-share'(el){ const w = S.workouts.find(x => x.id === el.dataset.id); if (!w) return; if (!w.shared && !Social.canPublish()) { toast(Social.ready() ? 'Tu perfil es privado' : 'Crea tu perfil en la pestaña Social'); return; } w.shared = !w.shared; Store.mark(); render(); toast(w.shared ? 'Publicado en el feed' : 'Quitado del feed'); },
  'm-close'(){ if (modalCb) { const cb = modalCb; modalCb = null; cb(null); } closeModal(); },
  'm-answer'(el){ const cb = modalCb; modalCb = null; if (cb) cb(el.dataset.v); }
};
function fillFromPh(e, si){
  const s = e.sets[si], ph = phFor(e, si) || {};
  ['kg', 'reps', 'sec', 'km', 'min'].forEach(f => { if (s[f] == null && ph[f] != null) s[f] = ph[f]; });
}
function syncTitle(){ const t = $('#edTitle'); if (!t || !ED) return; if (ED.mode === 'routine') ED.data.name = t.value; else ED.data.title = t.value; }

function delSet(ei, si){
  if (!ED) return; const e = ED.data.exercises[ei]; if (!e || !e.sets[si]) return;
  const [gone] = e.sets.splice(si, 1); renderEditor(); edTouch();
  toast('Serie eliminada', {label: 'Deshacer', fn: () => { if (ED && ED.data.exercises[ei] === e) { e.sets.splice(si, 0, gone); renderEditor(); edTouch(); } }});
}
function fixSS(list){ list.forEach((e, i) => { if (e.ss && (list[i - 1] || {}).ss !== e.ss && (list[i + 1] || {}).ss !== e.ss) e.ss = null; }); }
function openReorder(){
  const d = ED.data;
  modal('Reordenar ejercicios', `<div class="small muted">Mantén y arrastra cada ejercicio a su sitio.</div><div class="reord" id="reord">${d.exercises.map((e, i) => { const x = exOf(e.exId); return `<div class="ritem" data-i="${i}">${photoImg(x)}<span>${esc(x.name)}</span><b class="grip" aria-hidden="true">≡</b></div>`; }).join('')}</div>`, `<button class="btn primary" data-act="m-close">Listo</button>`);
}
function applyReorder(){
  const list = $('#reord'); if (!list || !ED) return;
  const old = ED.data.exercises, order = [...list.children].map(n => +n.dataset.i);
  ED.data.exercises = order.map(i => old[i]); fixSS(ED.data.exercises);
  [...list.children].forEach((n, i) => { n.dataset.i = i; });
  renderEditor(); edTouch();
}
// Gestos: deslizar serie para borrar · arrastrar para reordenar · mantener cabecera de ejercicio para reordenar
let SW = null, RD = null, LP = null, swallowUntil = 0;
document.addEventListener('click', ev => { if (Date.now() < swallowUntil) { ev.stopPropagation(); ev.preventDefault(); } }, true);
document.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'mouse' && ev.button) return;
  const it = ev.target.closest('#reord .ritem');
  if (it) { const mb = it.closest('.mb'); RD = {el: it, id: ev.pointerId, mb, y0: ev.clientY + (mb ? mb.scrollTop : 0)}; it.classList.add('drag'); try { it.setPointerCapture(ev.pointerId); } catch (e) {} try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} return; }
  const row = ev.target.closest('#editor .srow');
  if (row) { SW = {row, wrap: row.parentNode, id: ev.pointerId, x: ev.clientX, y: ev.clientY, dx: 0, on: false}; return; }
  const hd = ev.target.closest('#editor .excard .exh');
  if (hd && ED && ED.data.exercises.length > 1 && !ev.target.closest('[data-act="ex-menu"]')) {
    LP = {x: ev.clientX, y: ev.clientY, id: ev.pointerId, t: setTimeout(() => { LP = null; swallowUntil = Date.now() + 600; try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} openReorder(); }, 480)};
  }
});
document.addEventListener('pointermove', ev => {
  if (LP && ev.pointerId === LP.id && Math.hypot(ev.clientX - LP.x, ev.clientY - LP.y) > 8) { clearTimeout(LP.t); LP = null; }
  if (RD && ev.pointerId === RD.id) {
    const el = RD.el, mb = RD.mb, list = el.parentNode;
    if (mb) { const r = mb.getBoundingClientRect(); if (ev.clientY < r.top + 40) mb.scrollTop -= 8; else if (ev.clientY > r.bottom - 40) mb.scrollTop += 8; }
    const y = ev.clientY + (mb ? mb.scrollTop : 0);
    let dy = y - RD.y0;
    const prev = el.previousElementSibling, next = el.nextElementSibling;
    if (next && dy > next.offsetHeight / 2) { const t0 = el.offsetTop; list.insertBefore(next, el); RD.y0 += el.offsetTop - t0; }
    else if (prev && dy < -prev.offsetHeight / 2) { const t0 = el.offsetTop; list.insertBefore(el, prev); RD.y0 += el.offsetTop - t0; }
    dy = y - RD.y0; el.style.transform = `translateY(${dy}px) scale(1.02)`;
    ev.preventDefault(); return;
  }
  if (!SW || ev.pointerId !== SW.id) return;
  const dx = ev.clientX - SW.x, dy = ev.clientY - SW.y;
  if (!SW.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { SW = null; return; }
    if (dx < -12 && Math.abs(dx) > Math.abs(dy) * 1.4) { SW.on = true; SW.row.classList.add('swiping'); SW.wrap.classList.add('sw'); try { SW.row.setPointerCapture(ev.pointerId); } catch (e) {} const a = document.activeElement; if (a && a.classList && a.classList.contains('sin')) a.blur(); }
    else return;
  }
  SW.dx = Math.min(0, dx); const w = SW.row.offsetWidth, arm = -SW.dx > Math.max(90, w * .38);
  SW.row.style.transform = `translateX(${SW.dx}px)`;
  SW.wrap.style.setProperty('--sw', (-SW.dx) + 'px'); SW.wrap.style.setProperty('--swo', Math.min(1, -SW.dx / 40));
  if (arm !== !!SW.arm) { SW.arm = arm; SW.wrap.classList.toggle('arm', arm); if (arm) try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
});
function endGesture(ev){
  if (LP && ev.pointerId === LP.id) { clearTimeout(LP.t); LP = null; }
  if (RD && ev.pointerId === RD.id) { RD.el.classList.remove('drag'); RD.el.style.transform = ''; RD = null; applyReorder(); return; }
  if (!SW || ev.pointerId !== SW.id) return;
  const s = SW; SW = null; if (!s.on) return;
  swallowUntil = Date.now() + 350; s.row.classList.remove('swiping');
  if (s.arm && ev.type === 'pointerup') { s.row.classList.add('gone'); s.wrap.style.setProperty('--sw', '100%'); setTimeout(() => delSet(+s.row.dataset.ei, +s.row.dataset.si), 190); }
  else { s.row.classList.add('snap'); s.row.style.transform = ''; s.wrap.style.setProperty('--sw', '0px'); s.wrap.classList.remove('arm'); setTimeout(() => { s.row.classList.remove('snap'); s.wrap.classList.remove('sw'); }, 250); }
}
document.addEventListener('pointerup', endGesture); document.addEventListener('pointercancel', endGesture);
// Al tocar un peso o unas reps ya puestos, se selecciona todo: lo que escribas sustituye al valor anterior
let selFocus = null;
document.addEventListener('focusin', ev => { const el = ev.target; if (el.classList && el.classList.contains('sin') && el.value) { selFocus = el; const go = () => { if (document.activeElement === el) try { el.setSelectionRange(0, el.value.length); } catch (e) { el.select(); } }; go(); setTimeout(go, 0); setTimeout(go, 60); } });
document.addEventListener('mouseup', ev => { if (selFocus && ev.target === selFocus) { ev.preventDefault(); selFocus = null; } });
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (ev.target.id === 'modal') A['m-close'](); return; }
  const act = el.dataset.act;
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  if (A[act]) { ev.preventDefault(); A[act](el); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'exSearch') { UI.exQuery = el.value; $('#exList').innerHTML = exListHTML(); return; }
  if (el.id === 'pkSearch') { PICK.q = el.value; drawPicker(); return; }
  if (!ED) return;
  if (el.id === 'edTitle') { syncTitle(); edTouch(); return; }
  if (el.dataset.act === 'set-in') { const s = ED.data.exercises[+el.dataset.ei].sets[+el.dataset.si]; const f = el.dataset.f; let v = num(el.value); if (v != null && (f === 'reps' || f === 'sec')) v = Math.round(v); s[f] = v; edTouch(); return; }
  if (el.dataset.act === 'ex-note') { ED.data.exercises[+el.dataset.ei].notes = el.value; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; edTouch(); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'setRest') { S.settings.rest = +el.value; Store.mark('meta'); toast('Descanso por defecto: ' + (S.settings.rest ? fmtClock(S.settings.rest) : 'sin temporizador')); }
  if (el.id === 'setNotif') { if (el.checked) askNotif().then(ok => { el.checked = ok; }); else { S.settings.notif = false; Store.mark('meta'); } }
  if (el.id === 'setSound') { S.settings.sound = el.checked; Store.mark('meta'); if (el.checked) { unlockAudio(); beep(); } }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#modal').classList.contains('open')) A['m-close']();
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('sin')) { const all = [...document.querySelectorAll('#editor .sin')]; const i = all.indexOf(ev.target); if (all[i + 1]) all[i + 1].focus(); else ev.target.blur(); ev.preventDefault(); }
});
$('#fileCsv').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const text = await f.text();
    const r = importHevyCSV(text);
    render();
    const msg = `<div><b>${r.added}</b> ${r.added === 1 ? 'entreno importado' : 'entrenos importados'}${r.skipped ? `, ${r.skipped} ya estaban` : ''}.</div>${r.created.length ? `<div class="small muted">${r.created.length === 1 ? 'Se ha creado 1 ejercicio propio que no estaba' : `Se han creado ${r.created.length} ejercicios propios que no estaban`} en la biblioteca: ${esc(r.created.slice(0, 8).join(', '))}${r.created.length > 8 ? '…' : ''}. Puedes editarlos en Ejercicios.</div>` : ''}`;
    await ask('Importación lista', msg, [['ok', 'Seguir', 'primary']]); closeModal();
    if (r.added) offerRoutinesFromHistory();
  } catch (e) { ask('No se pudo importar', esc(e.message || 'Revisa que sea el CSV que exporta Hevy.'), [['ok', 'Vale']]).then(closeModal); }
});
$('#fileJson').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (d.app !== 'hierro') throw new Error('Este archivo no es una copia de Hierro.');
    const ok = await ask('Restaurar copia', `La copia tiene ${(d.workouts || []).length} entrenos y ${(d.routines || []).length} rutinas. Sustituirá lo que tienes ahora.`, [['0', 'Cancelar'], ['1', 'Restaurar', 'primary']]); closeModal();
    if (ok !== '1') return;
    const oldMonths = S.workouts.map(w => monthKey(w.start));
    Store.apply({...d, active: S.active});
    Store.mark('meta', ...new Set([...oldMonths, ...S.workouts.map(w => monthKey(w.start))])); render(); toast('Copia restaurada');
  } catch (e) { ask('No se pudo restaurar', esc(e.message), [['ok', 'Vale']]).then(closeModal); }
});
window.addEventListener('pagehide', () => Store.flushNow());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushNow(); });

/* ---------- Instalación y actualizaciones (PWA) ---------- */
const APP_VERSION = '4.2.0';
const UA = navigator.userAgent;
const IS_IOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /android/i.test(UA);
const IS_MOBILE = IS_IOS || IS_ANDROID;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
let deferredPrompt = null, UPDATE = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; render(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('Hierro instalada'); render(); });
function backupStale(){ return S.workouts.length >= 5 && (!S.settings.lastBackup || Date.now() - S.settings.lastBackup > 30 * 864e5); }
function installCard(force){
  if (isStandalone() || (!force && S.settings.hideInstall)) return '';
  const share = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v8h14v-8"/></svg>';
  let how;
  if (deferredPrompt) how = `<button class="btn primary block" data-act="install">Instalar Hierro</button>`;
  else if (IS_IOS) how = `<ol class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Abre esta página en <b>Safari</b>.</li><li>Toca Compartir ${share} (abajo o arriba a la derecha).</li><li>Elige <b>Añadir a pantalla de inicio</b> y luego <b>Añadir</b>.</li></ol>`;
  else if (IS_ANDROID) how = `<div class="small">En Chrome, toca el menú <b>⋮</b> y elige <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.</div>`;
  else how = `<div class="small">Ábrela en el navegador de tu móvil para instalarla. En el ordenador, Chrome y Edge muestran un botón de instalar en la barra de direcciones.</div>`;
  return `<div class="card stack"><div class="row between"><h3>Instálala en tu móvil</h3>${force ? '' : '<button class="btn ghost sm" data-act="hide-install">Ahora no</button>'}</div><div class="small muted">Se abre a pantalla completa, con su icono, y funciona sin conexión en el gimnasio.</div>${how}</div>`;
}
function updateCard(){ return UPDATE ? `<div class="card next row between"><div><b>Hay una versión nueva</b><div class="small muted">Tus datos se mantienen.</div></div><button class="btn primary sm" data-act="do-update">Actualizar</button></div>` : ''; }
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const watch = w => w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { UPDATE = w; render(); } });
      if (reg.waiting && navigator.serviceWorker.controller) { UPDATE = reg.waiting; render(); }
      reg.addEventListener('updatefound', () => watch(reg.installing));
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch(() => {});
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; location.reload(); });
  });
}

async function signOutLocal(){
  clearTimeout(Store.timer); Store.timer = null; clearTimeout(Sync.timer);

  Cloud.session = null; Sync.state = 'idle';
  if (ED) { $('#editor').classList.remove('open'); $('#editor').innerHTML = ''; ED = null; }
  A['sum-close'](); REST = null; drawRest(); wakeLock(false);
  Store.reset(); Store.key = 'nouser'; Social.reset();
  tab = 'home'; Object.keys(navStack).forEach(k => navStack[k] = []);
  render();
}
rebuildEx();
(async () => {
  await KV.open();

    Cloud.session = await KV.get('session');

})();
