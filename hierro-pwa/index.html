/* Tema (Automático / Claro / Oscuro): se fija antes de pintar para que no haya parpadeo, tampoco en la pantalla de entrada */
(function(){var p='auto',d=document.documentElement;try{p=localStorage.getItem('hierro-theme')||'auto';}catch(e){}
var t=p==='light'||p==='dark'?p:(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
d.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='light'?'#E8EDFA':'#070B1A';})();
</script>

<style>
/* «Aurora» (oscuro) y «Glaciar» (claro): cristal translúcido sobre luces de aurora, degradado azul → violeta → rosa.
   Columna móvil (máx. 560px), pestañas flotantes abajo; el entreno activo es una hoja a pantalla completa.
   Los colores viven en variables bajo :root[data-theme="dark"|"light"]; el tema lo fija un script al inicio del <head>. */
:root{
  --mo-dur:300ms; --mo-dur-fast:180ms; --mo-ease:cubic-bezier(.22,1,.36,1); --mo-ease-spring:cubic-bezier(.34,1.45,.64,1);
  --rotulo:'Sora','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cuerpo:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-xl:28px; --r-l:24px; --r-m:16px; --r-s:10px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
/* Aurora (oscuro). También es el valor por defecto si el script del <head> no llegara a ejecutarse. */
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --fondo:#070B1A; --elev:#121836; --elev-2:#1A2142; --sheet:rgba(18,24,54,.9);
  --sup:rgba(255,255,255,.06); --sup-2:rgba(255,255,255,.08); --sup-3:rgba(255,255,255,.14); --sup-solid:#131830;
  --linea:rgba(255,255,255,.10);
  --texto:#F2F4FF; --apagado:#A9B0CC; --tenue:#7C86AD; --ph:#8E97BA;
  --tiza:#F2F4FF; --tiza-tinta:#0B1030; --foco:#A9C0FF;
  --acc:#5B8CFF; --acc-t:#9DB6FF; --acc-soft:rgba(91,140,255,.20); --violeta:#A86BFF; --violeta-t:#C9A5FF; --rosa:#FF6FB1;
  --c1:#41548F; --c2:#5B8CFF; --c3:#A86BFF; --c4:#FF6FB1; --c5:#FFB3D6;
  --pr:#FFB3D6; --pr-soft:rgba(255,179,214,.16); --pr-borde:rgba(255,179,214,.34);
  --ok:#8FE3C8; --ok-t:#8FE3C8; --ok-soft:rgba(143,227,200,.16);
  --aviso:#FFC266; --aviso-t:#FFC266;
  --frio:#7FC8FF; --peligro:#FF6B81;
  --ascua:var(--acc); --ascua-tinta:#fff;
  --grad:linear-gradient(90deg,#5B8CFF,#A86BFF 55%,#FF6FB1);
  --grad-d:linear-gradient(135deg,#5B8CFF,#B06BFF);
  --forja:var(--grad);
  --g1:#5B8CFF; --g2:#A86BFF; --g3:#FF6FB1;
  --glass:rgba(255,255,255,.07); --glass-borde:rgba(255,255,255,.12); --glass-bar:rgba(20,26,54,.74);
  --field:rgba(255,255,255,.06); --field-borde:rgba(255,255,255,.14); --field-modal:#1A2142;
  --sel-tint:rgba(120,140,255,.15); --track:rgba(255,255,255,.10); --ring-in:#10162F; --band:rgba(255,255,255,.14);
  --bar:rgba(169,176,204,.45); --dot:rgba(255,255,255,.08); --dot-fut:rgba(255,255,255,.05);
  --glow:rgba(120,110,255,.45); --btn-txt-sh:0 1px 2px rgba(7,11,26,.4);
  --sombra:none; --sombra-hero:none;
  --sombra-bar:0 14px 34px rgba(0,0,0,.40);
  --sombra-flot:0 18px 40px rgba(0,0,0,.50),0 0 0 1px rgba(255,255,255,.08);
  --scrim:rgba(4,6,16,.66);
  --aurora:radial-gradient(380px 380px at 0% 0%,rgba(91,140,255,.44),transparent 72%),radial-gradient(360px 360px at 100% 36%,rgba(176,107,255,.32),transparent 72%),radial-gradient(330px 330px at 18% 100%,rgba(255,111,177,.20),transparent 72%);
}
/* Glaciar (claro) */
:root[data-theme="light"]{
  color-scheme:light;
  --fondo:#E8EDFA; --elev:#F7F9FF; --elev-2:#FFFFFF; --sheet:rgba(247,249,255,.92);
  --sup:rgba(255,255,255,.58); --sup-2:rgba(14,22,48,.06); --sup-3:rgba(14,22,48,.10); --sup-solid:#F3F6FD;
  --linea:rgba(14,22,48,.10);
  --texto:#0E1630; --apagado:#4A5578; --tenue:#7A84A6; --ph:#66708F;
  --tiza:#0E1630; --tiza-tinta:#FFFFFF; --foco:#3D5BFF;
  --acc:#3D5BFF; --acc-t:#2F49E0; --acc-soft:rgba(61,91,255,.10); --violeta:#8A5CFF; --violeta-t:#6B3FE6; --rosa:#E0408F;
  --c1:#9DB0EE; --c2:#3D5BFF; --c3:#8A5CFF; --c4:#E0408F; --c5:#C42B78;
  --pr:#C42B78; --pr-soft:rgba(196,43,120,.10); --pr-borde:rgba(196,43,120,.30);
  --ok:#0E9F77; --ok-t:#0A7A5B; --ok-soft:rgba(14,159,119,.12);
  --aviso:#F0A52B; --aviso-t:#9A5A00;
  --frio:#0E6FA8; --peligro:#C7324E;
  --g1:#3D5BFF; --g2:#8A5CFF; --g3:#E0408F;
  --grad:linear-gradient(90deg,#3D5BFF,#8A5CFF);
  --grad-d:linear-gradient(135deg,#3D5BFF,#8A5CFF);
  --glass:rgba(255,255,255,.58); --glass-borde:rgba(255,255,255,.9); --glass-bar:rgba(255,255,255,.74);
  --field:#FFFFFF; --field-borde:#CCD4EC; --field-modal:#FFFFFF;
  --sel-tint:rgba(61,91,255,.09); --track:rgba(14,22,48,.09); --ring-in:#F4F6FD; --band:rgba(14,22,48,.12);
  --bar:rgba(61,91,255,.55); --dot:rgba(14,22,48,.06); --dot-fut:rgba(14,22,48,.035);
  --glow:rgba(61,91,255,.38); --btn-txt-sh:none;
  --sombra:0 14px 34px -10px rgba(40,60,140,.24); --sombra-hero:0 20px 50px rgba(40,60,140,.14);
  --sombra-bar:0 14px 34px rgba(40,60,140,.16);
  --sombra-flot:0 18px 44px rgba(40,60,140,.26),0 0 0 1px rgba(255,255,255,.7);
  --scrim:rgba(14,22,48,.36);
  --aurora:radial-gradient(400px 400px at 0% 0%,rgba(143,176,255,.80),transparent 72%),radial-gradient(380px 380px at 100% 36%,rgba(201,168,255,.70),transparent 72%),radial-gradient(340px 340px at 12% 100%,rgba(255,196,225,.70),transparent 72%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{background-color:var(--fondo);background-image:var(--aurora);background-repeat:no-repeat}
body{background:transparent;color:var(--texto);font-family:var(--cuerpo);font-size:16px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}
/* iPhone en claro: la barra de estado de la app instalada tiene letras blancas siempre; le ponemos detrás una franja oscura para que se lea */
html.ios-pwa[data-theme="light"] body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:#0E1630;z-index:100;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
input,select,textarea{background:var(--field);border:0;box-shadow:inset 0 0 0 1.5px var(--field-borde);border-radius:14px;padding:12px 14px;width:100%;min-height:48px}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
input[type=checkbox]{min-height:0;width:22px;height:22px;padding:0;accent-color:var(--acc);flex:none;box-shadow:none}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--ph)}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--rotulo);font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.02em}
h2{font-family:var(--rotulo);font-weight:700;font-size:20px;line-height:1.25;letter-spacing:-.02em}
h3{font-family:var(--rotulo);font-size:16.5px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--apagado)}
.small{font-size:13.5px}

#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
/* iPhone con la app instalada: iOS a veces da un alto de pantalla recortado (sin la barra de estado) y el menú queda flotando. Usamos el alto real. */
html.ios-pwa,html.ios-pwa body{height:var(--apph,100vh)}
html.ios-pwa #app{bottom:auto;height:var(--apph,100vh)}
html.ios-pwa .layer,html.ios-pwa #modal{bottom:auto;height:var(--apph,100vh)}
html.ios-pwa #rest{bottom:auto;top:calc(var(--apph,100vh) - 14px - var(--sab));transform:translate(-50%,-100%)}
#top{padding:calc(8px + var(--sat)) 16px 6px;display:flex;align-items:center;gap:8px;min-height:60px;position:relative;z-index:3;background:transparent}
#top .t{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
#top.sub{padding-left:6px}
#top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand{display:flex;align-items:center;gap:10px}
#top .brand svg{width:34px;height:34px}
#top .brand h1{font-weight:800;font-size:25px}
#top .acts{gap:2px}
.sync{font-size:12.5px;font-weight:700;color:var(--apagado);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--tenue);display:inline-block}
.sync.ok i{background:var(--ok)}
.sync.busy i{background:var(--violeta);animation:late 1.2s ease-in-out infinite}
.sync.off i{background:var(--frio)}
#top.sub .sync span,#top.compact .sync span{display:none}
@keyframes late{50%{opacity:.35}}
/* el contenido se desvanece al pasar bajo la cabecera */
#view,.mo-ghost{flex:1;overscroll-behavior-y:contain;overflow-y:auto;overflow-x:hidden;padding:12px 16px 28px;display:flex;flex-direction:column;gap:14px;-webkit-mask-image:linear-gradient(transparent 0,#000 12px);mask-image:linear-gradient(transparent 0,#000 12px)}
#view>*,.mo-ghost>*{flex:none}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);margin:2px 14px calc(10px + var(--sab));padding:6px;border-radius:28px;background:var(--glass-bar);border:1px solid var(--glass-borde);box-shadow:var(--sombra-bar);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);position:relative;z-index:3}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:56px;font-size:11px;font-weight:700;color:var(--apagado);position:relative}
#tabs{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tabs .ti{display:flex;align-items:center;justify-content:center;width:48px;height:32px;border-radius:16px;transition:transform var(--mo-dur) var(--mo-ease-spring),color .2s;position:relative}
#tabs svg{width:23px;height:23px}
#tabs button:focus-visible{outline:2px solid var(--foco);outline-offset:-2px;border-radius:22px}
#tabs button[aria-current="page"]{color:var(--texto)}
#tabs button[aria-current="page"] .ti{color:#fff;transform:scale(1.12)}
/* Píldora deslizante: solo transform; la posición la fija renderTabs()/gesto en px */
#tabs .pill{position:absolute;left:0;top:0;width:48px;height:32px;border-radius:16px;background:var(--grad-d);box-shadow:0 8px 20px -6px var(--glow);pointer-events:none;will-change:transform;transition:transform var(--mo-dur) var(--mo-ease-spring)}
#tabs.nt .pill,#tabs.drag .pill{transition:none}
#tabs.drag .ti{transition:transform var(--mo-dur-fast) var(--mo-ease),color .2s}
:root[data-theme="light"] #tabs button[aria-current="page"]{color:var(--acc)}
:root[data-theme="light"] #tabs button[aria-current="page"] .ti{color:var(--acc)}
:root[data-theme="light"] #tabs .pill{background:rgba(61,91,255,.15);box-shadow:inset 0 0 0 1px rgba(61,91,255,.22),0 6px 16px -8px var(--glow)}
@media (prefers-reduced-motion:reduce){#tabs .pill,#tabs .ti{transition:none}}
/* durante la View Transition la barra sigue viva (su propia capa, sin captura congelada) */
html[data-mo] #tabs{view-transition-name:mo-tabs}
html[data-mo]::view-transition-group(mo-tabs),html[data-mo]::view-transition-new(mo-tabs){animation:none}
html[data-mo]::view-transition-old(mo-tabs){display:none;animation:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:var(--r-m);padding:8px 18px;font-weight:700;background:var(--sup-2);color:var(--texto);text-align:center;line-height:1.2}
.card .btn:not(.primary):not(.good):not(.ghost),#modal .btn:not(.primary):not(.good):not(.ghost),.excard .btn:not(.primary):not(.ghost),.mghost .btn:not(.primary):not(.good):not(.ghost){background:var(--sup-3)}
.btn.primary,.btn.good{background:var(--grad);color:#fff;font-family:var(--rotulo);letter-spacing:-.01em;box-shadow:0 10px 28px -6px var(--glow);text-shadow:var(--btn-txt-sh)}
.btn.ghost{background:none;color:var(--apagado);padding:8px 10px;min-height:44px}
.btn.danger{color:var(--peligro)}
.btn.block{width:100%}
.btn.lg{min-height:56px;font-size:17px;border-radius:18px}
.btn.sm{min-height:44px;padding:6px 14px;font-size:14.5px;border-radius:12px;white-space:nowrap}
.btn.dashed{background:none;border:1.5px dashed var(--sup-3);color:var(--apagado)}
.grid2 .btn{padding:8px 10px;font-size:15px}
.btn:disabled{opacity:.4}
.btn svg{width:20px;height:20px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--texto);flex:none;position:relative}
.iconbtn:active{background:var(--sup-2)}
.iconbtn:disabled{opacity:.3}
.iconbtn svg{width:24px;height:24px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--sup);border:1px solid var(--glass-borde);border-radius:var(--r-l);padding:16px;box-shadow:var(--sombra)}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block}
.card.tap.stack,.card.tap.wcard{display:flex}
.card.tap.row{display:flex}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.chip{display:inline-flex;align-items:center;min-height:44px;background:var(--sup-2);border-radius:999px;padding:0 15px;font-size:14.5px;font-weight:700;white-space:nowrap;color:var(--apagado);flex:none}
.card .chip{background:var(--sup-2)}
.chip[aria-pressed="true"]{background:var(--tiza);color:var(--tiza-tinta)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.card .chips{margin:0;padding-left:0;padding-right:0}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;min-height:24px;padding:2px 10px;border-radius:999px;background:var(--sup-2);color:var(--apagado);white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.accent,.pill.good{background:var(--acc-soft);color:var(--acc-t)}
.pill.gold{background:var(--pr-soft);color:var(--pr)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat b{font-family:var(--rotulo);font-size:clamp(15px,4.8vw,19px);overflow:hidden;text-overflow:ellipsis;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--apagado)}
.stat b.pr{color:var(--pr)}
.empty{text-align:center;padding:32px 12px;color:var(--apagado);display:flex;flex-direction:column;gap:14px;align-items:center}
.empty h3{color:var(--texto);font-family:var(--rotulo);font-weight:700;font-size:22px;line-height:1.3}

/* inicio */
.toca{background:var(--glass);border:1px solid var(--glass-borde);color:var(--texto);border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sombra-hero)}
.toca .sub{font-size:12.5px;font-weight:700;color:var(--acc-t)}
.toca .top{display:flex;align-items:center;gap:16px}
.toca .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.toca h2{font-size:32px;font-weight:800;line-height:1.08;letter-spacing:-.03em;overflow-wrap:anywhere}
.toca .meta{font-size:13px;color:var(--apagado)}
.toca .ej{font-size:13.5px;color:var(--apagado);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toca .mp{display:flex;gap:6px;flex-wrap:wrap}
.toca .mp span{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--sup-2);color:var(--texto)}
.wring{width:92px;height:92px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--acc),var(--violeta) calc(var(--p)*1%),var(--track) 0)}
.wring div{width:74px;height:74px;border-radius:50%;background:var(--ring-in);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.wring b{font-family:var(--rotulo);font-weight:800;font-size:23px;line-height:1;letter-spacing:-.02em}
.wring small{font-size:11px;font-weight:600;color:var(--apagado);line-height:1}
.wcard{display:flex;flex-direction:column;gap:12px}
.wcard h3{font-size:18px}
.ex-lines{display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.ex-lines span{display:flex;gap:8px}
.ex-lines span b{font-variant-numeric:tabular-nums;color:var(--apagado);font-weight:700;min-width:28px;flex:none}
.ex-lines em{font-style:normal;margin-left:auto;color:var(--apagado);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px}
.wk i{width:34px;height:34px;border-radius:50%;background:var(--dot);display:flex;align-items:center;justify-content:center;color:#fff;box-sizing:border-box}
.wk i svg{width:16px;height:16px}
.wk .fut i{background:var(--dot-fut)}
.wk .on i{background:var(--grad-d);box-shadow:0 6px 14px -5px var(--glow)}

.chart{width:100%;height:auto;display:block}

.pweek{display:flex;flex-direction:column;border-top:1px solid var(--linea)}

/* Motor de transiciones (navTo): View Transitions si existen; si no, 'fantasma' de la vista anterior + animaciones CSS */
html[data-mo=push]{--mo-in:mo-push-in;--mo-out:mo-push-out}
html[data-mo=pop]{--mo-in:mo-pop-in;--mo-out:mo-pop-out}
html[data-mo=tab-f]{--mo-in:mo-tf-in;--mo-out:mo-tf-out}
html[data-mo=tab-b]{--mo-in:mo-tb-in;--mo-out:mo-tb-out}
@keyframes mo-push-in{from{transform:translateX(24%);opacity:0}to{transform:none;opacity:1}}
@keyframes mo-push-out{from{transform:none;opacity:1}to{transform:translateX(-26%);opacity:0}}
@keyframes mo-pop-in{from{transform:translateX(-26%);opacity:0}to{transform:none;opacity:1}}
@keyframes mo-pop-out{from{transform:none;opacity:1}55%{opacity:1}to{transform:translateX(100%);opacity:0}}
@keyframes mo-tf-in{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes mo-tf-out{from{transform:none;opacity:1}to{transform:translateX(-14%) scale(.97);opacity:0}}
@keyframes mo-tb-in{from{transform:translateX(-18px);opacity:0}to{transform:none;opacity:1}}
@keyframes mo-tb-out{from{transform:none;opacity:1}to{transform:translateX(14%) scale(.97);opacity:0}}
@keyframes mo-fade-in{from{opacity:0}}
@keyframes mo-fade-out{to{opacity:0}}
html[data-mo] #view{view-transition-name:mo-view}
html[data-mo] #top{view-transition-name:mo-top}
html[data-mo]::view-transition{pointer-events:none}
html[data-mo]::view-transition-old(root){display:none}
html[data-mo]::view-transition-new(root),html[data-mo]::view-transition-group(mo-view),html[data-mo]::view-transition-group(mo-top){animation:none}
html[data-mo]::view-transition-old(mo-view),html[data-mo]::view-transition-new(mo-view),html[data-mo]::view-transition-old(mo-top),html[data-mo]::view-transition-new(mo-top){mix-blend-mode:normal}
html[data-mo]::view-transition-old(mo-top),html[data-mo]::view-transition-new(mo-top){animation-duration:var(--mo-dur-fast);animation-timing-function:ease}
html[data-mo]::view-transition-old(mo-view){animation:var(--mo-out) var(--mo-dur) var(--mo-ease) both}
html[data-mo]::view-transition-new(mo-view){animation:var(--mo-in) var(--mo-dur) var(--mo-ease) both}
html[data-mo=pop]::view-transition-old(mo-view){z-index:2}
/* 4.10.1: sin «pantallazo» de la pantalla anterior. Al cambiar de pestaña o abrir una subpantalla la vista vieja desaparece al instante
   (antes se fundía por debajo de la nueva) y el título cambia sin fundido. Solo «atrás» desliza la pantalla que se cierra. */
html[data-mo=tab-f]::view-transition-old(mo-view),html[data-mo=tab-b]::view-transition-old(mo-view),html[data-mo=push]::view-transition-old(mo-view),html[data-mo]::view-transition-old(mo-top){display:none;animation:none}
html[data-mo]::view-transition-new(mo-top){animation:none}
.mo-ghost{position:absolute;left:0;right:0;z-index:2;overflow:hidden;pointer-events:none}
.mo-gt{position:absolute;inset:0;display:flex;align-items:center;gap:8px;pointer-events:none}
html[data-mo=pop] .mo-ghost{z-index:4}
html[data-mo] .mo-ghost{animation:var(--mo-out) var(--mo-dur) var(--mo-ease) both;will-change:transform,opacity}
html[data-mo] #view.mo-new{animation:var(--mo-in) var(--mo-dur) var(--mo-ease) both;z-index:3;will-change:transform,opacity}
html[data-mo] #top.mo-new{animation:mo-fade-in var(--mo-dur-fast) ease both}
html[data-mo] .mo-gt{display:none}
/* Microanimaciones: pulsación, ventanas, barras al entrar y estados de control */
.btn,.iconbtn,.chip,.seg button,.cl-per button,.cl-row,.cl-item-main,.person .who,.notif,.navlist button,.card.tap,.post-actions button,.restline,.addset,.cl-emos button{transition:scale .45s var(--mo-ease-spring),background-color .2s}
.btn:not(:disabled):active,.chip:active,.seg button:active,.cl-per button:active,.cl-row:active,.cl-item-main:active,.person .who:active,.notif:active,.navlist button:active,.card.tap:active,.restline:active,.addset:active{scale:.97;transition-duration:.07s,.2s;transition-timing-function:ease-out}
.iconbtn:not(:disabled):active,.post-actions button:active,.cl-emos button:active{scale:.9;transition-duration:.07s,.2s;transition-timing-function:ease-out}
.btn:disabled,.iconbtn:disabled{scale:1}
/* Ventanas: fondo (::before) que funde y hoja que sube; la salida usa un fantasma .mghost */
#modal::before,.mghost::before{content:'';position:absolute;inset:0;background:var(--scrim)}
#modal,.mghost{background:none}
.mghost{position:fixed;inset:0;z-index:39;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}

#modal>.sheet,.mghost>.sheet{position:relative}
#modal.pop::before{animation:mo-fade-in var(--mo-dur) ease both}
#modal.pop>.sheet{animation:mo-sheet-in .42s var(--mo-ease) both;will-change:transform}
.mghost::before{animation:mo-fade-out .22s ease both}
.mghost>.sheet{animation:mo-sheet-out .22s cubic-bezier(.4,0,1,1) both;will-change:transform}
@keyframes mo-sheet-in{from{transform:translateY(100%)}}
@keyframes mo-sheet-out{to{transform:translateY(100%)}}
@keyframes mo-grow{from{transform:scaleX(0)}}
@keyframes mo-growy{from{transform:scaleY(0)}}
/* Barras que crecen al ENTRAR (.mo-in en #view solo tras navegar, nunca en refrescos) */
.mo-in .fill,.mo-in .cl-bar span,.mo-in .cl-mix i,.mo-in .pg span{transform-origin:left center;animation:mo-grow .65s var(--mo-ease) .12s both;will-change:transform}
.mo-in .chart rect{transform-box:fill-box;transform-origin:50% 100%;animation:mo-growy .6s var(--mo-ease) .12s both;will-change:transform}

    try {
      const [ws, st, posts, fFrom, fTo, nt, rqFrom, rqTo, bl] = await Promise.all([sub('workouts', 'start'), sub('state', 'srv'), q('posts', 'uid'), q('follows', 'from'), q('follows', 'to'),

      const cs = await Promise.all(myPosts.map(pid => this.query(['posts', pid], {from: [{collectionId: 'comments'}], select: {fields: [{fieldPath: 'ts'}]}})));

    } catch (e) {

    }
    names.push(this.name('users', uid));
    const un = S.settings.social && S.settings.social.username; if (un) names.push(this.name('usernames', un));
    names.push(this.name('profiles', uid), this.name('scores', uid));

    if (Push.url()) await Push.call('/coach/off', {}).catch(() => { /* sin suscripción */ });
    localStorage.removeItem(Coach.LS);
    for (let i = 0; i < names.length; i += 400) await this.commit(names.slice(i, i + 400).map(n => ({delete: n})));

/* =========================================================
   Cálculos: volumen, anteriores, chiquipuntos
   ========================================================= */
const isWork = s => s.t !== 'w';
// Etiqueta de la serie: el calentamiento no cuenta; fallo y drop set sí cuentan, pero enseñan su letra (1, F, 3, 4).
const setLab = (t, c) => t === 'w' ? 'W' : (++c.n, t === 'n' ? c.n : t.toUpperCase());
function setVol(s){ return (s.kg || 0) * (s.reps || 0); }
function e1rm(s){ if (!s.kg || !s.reps) return 0; return s.reps === 1 ? s.kg : s.kg * (1 + s.reps / 30); }
function wVolume(w){ let v = 0; w.exercises.forEach(e => e.sets.forEach(s => { v += setVol(s); })); return v; } // 4.11.1: el calentamiento también suma volumen (como en otras apps); récords y rangos siguen sin contarlo
function wSets(w){ let n = 0; w.exercises.forEach(e => n += e.sets.length); return n; }
function hasData(s, type){
  if (type === 'dur') return s.sec > 0;
  if (type === 'cardio') return s.km > 0 || s.min > 0;
  return s.reps > 0;
}
function exHistory(exId, beforeTs = Infinity, excludeId = null){
  const out = [];
  for (const w of S.workouts) {
    if (w.start >= beforeTs || w.id === excludeId) continue;
    const blocks = w.exercises.filter(e => e.exId === exId);
    if (blocks.length) out.push({w, sets: blocks.flatMap(b => b.sets)});
  }
  return out; // ya ordenado desc
}
function prevSets(exId, excludeId){ const h = exHistory(exId, Infinity, excludeId); return h.length ? h[0].sets : []; }
function bestsOf(exId, beforeTs, excludeId){
  const b = {kg: 0, e1rm: 0, vol: 0, reps: 0, sec: 0, km: 0, sessVol: 0};
  for (const {sets} of exHistory(exId, beforeTs, excludeId)) {
    let sv = 0;
    for (const s of sets) { if (!isWork(s)) continue; b.kg = Math.max(b.kg, s.kg || 0); b.e1rm = Math.max(b.e1rm, e1rm(s)); b.vol = Math.max(b.vol, setVol(s)); b.reps = Math.max(b.reps, s.reps || 0); b.sec = Math.max(b.sec, s.sec || 0); b.km = Math.max(b.km, s.km || 0); sv += setVol(s); }
    b.sessVol = Math.max(b.sessVol, sv);
  }
  return b;
}
function computePRs(w){
  const prs = [];
  for (const e of w.exercises) {
    const type = exOf(e.exId).type;
    const old = bestsOf(e.exId, w.start, w.id);
    const hadHistory = exHistory(e.exId, w.start, w.id).length > 0;
    if (!hadHistory) continue; // primera vez: no cuenta como chiquipunto
    const work = e.sets.filter(isWork);
    const cur = {kg: 0, e1rm: 0, vol: 0, reps: 0, sec: 0, km: 0};
    work.forEach(s => { cur.kg = Math.max(cur.kg, s.kg || 0); cur.e1rm = Math.max(cur.e1rm, e1rm(s)); cur.vol = Math.max(cur.vol, setVol(s)); cur.reps = Math.max(cur.reps, s.reps || 0); cur.sec = Math.max(cur.sec, s.sec || 0); cur.km = Math.max(cur.km, s.km || 0); });
    const add = (kind, label, val, txt, prev) => prs.push({exId: e.exId, kind, label, val, txt, prev});
    if (type === 'wr' || (type === 'bw' && cur.kg > 0)) {
      if (cur.kg > old.kg) add('kg', 'Peso más alto', cur.kg, fmtN(cur.kg) + ' kg', old.kg ? fmtN(old.kg) + ' kg' : '');
      if (cur.e1rm > old.e1rm + 0.01) add('e1rm', '1RM estimado', cur.e1rm, fmtN(cur.e1rm) + ' kg', old.e1rm ? fmtN(old.e1rm) + ' kg' : '');
      if (cur.vol > old.vol) add('vol', 'Mejor serie (volumen)', cur.vol, fmtN(cur.vol, 0) + ' kg', old.vol ? fmtN(old.vol, 0) + ' kg' : '');
    }
    if (type === 'bw' && cur.reps > old.reps) add('reps', 'Más repeticiones', cur.reps, cur.reps + ' reps', old.reps ? old.reps + ' reps' : '');
    if (type === 'dur' && cur.sec > old.sec) add('sec', 'Más tiempo', cur.sec, fmtClock(cur.sec), old.sec ? fmtClock(old.sec) : '');
    if (type === 'cardio' && cur.km > old.km) add('km', 'Más distancia', cur.km, fmtN(cur.km, 2) + ' km', old.km ? fmtN(old.km, 2) + ' km' : '');
  }

}
// Chiquipunto de una serie concreta, al momento de marcarla (compara con el historial y con las series anteriores de hoy)
function setPR(d, ei, si, cache){
  const e = d.exercises[ei], s = e.sets[si]; if (!s || !s.done || !isWork(s)) return null;
  const type = exOf(e.exId).type;
  let base = cache && cache[e.exId];
  if (!base) { base = exHistory(e.exId, d.start, d.id).length ? bestsOf(e.exId, d.start, d.id) : false; if (cache) cache[e.exId] = base; }
  if (!base) return null; // primera vez: no cuenta
  const b = Object.assign({}, base);
  d.exercises.forEach((x, i) => { if (x.exId !== e.exId) return; x.sets.forEach((q, j) => { if (!(i < ei || (i === ei && j < si)) || !q.done || !isWork(q)) return; b.kg = Math.max(b.kg, q.kg || 0); b.e1rm = Math.max(b.e1rm, e1rm(q)); b.vol = Math.max(b.vol, setVol(q)); b.reps = Math.max(b.reps, q.reps || 0); b.sec = Math.max(b.sec, q.sec || 0); b.km = Math.max(b.km, q.km || 0); }); });
  if (type === 'wr' || (type === 'bw' && s.kg > 0)) {
    if ((s.kg || 0) > b.kg) return {label: 'Peso más alto', txt: fmtN(s.kg) + ' kg'};

}

let tab = 'home';
const navStack = {home: [], train: [], social: [], clan: [], me: []};
const UI = {hQuery: '', exQuery: '', exMuscle: '', exMetric: 'kg', exTab: 'prog', exRange: 'all', feedN: 15, calMonth: null, mMetric: 'waist', stRange: '3m', stMetric: 'vol', stGroup: 'Espalda', stSec: 'act', stView: 'radar', stMore: {}, rkMore: false};
const cur = () => navStack[tab][navStack[tab].length - 1];

/* ---------- Motor de transiciones ----------
   navTo(mutate, {keep}): ejecuta mutate() (solo cambia tab/navStack), deduce el tipo
   (push | pop | tab-f | tab-b | nada) y renderiza animando. render() a secas NO anima:
   los refrescos de datos siguen siendo instantáneos. keep: no llevar el scroll a 0. */
const TAB_ORDER = ['home', 'train', 'social', 'clan', 'me'];
const MO = {vt: null, ghosts: [], anims: [], id: 0, timer: 0};
const moReduce = () => { try { return matchMedia('(prefers-reduced-motion:reduce)').matches; } catch (e) { return false; } };
function moEnd(){ // corta de golpe la transición en curso: siempre queda una sola vista, limpia
  clearTimeout(MO.timer);
  if (MO.vt) { try { MO.vt.skipTransition(); } catch (e) {} MO.vt = null; }
  MO.ghosts.forEach(g => g.remove()); MO.ghosts = [];
  MO.anims.forEach(a => { try { a.cancel(); } catch (e) {} }); MO.anims = [];
  document.documentElement.removeAttribute('data-mo');
  $('#view').classList.remove('mo-new'); $('#top').classList.remove('mo-new');
}
function moStagger(){ // entrada escalonada de las primeras tarjetas (solo opacidad + translateY pequeña)
  [...$('#view').children].slice(0, 7).forEach((el, i) => {
    try { MO.anims.push(el.animate([{opacity: 0, transform: 'translateY(10px)'}, {opacity: 1, transform: 'none'}], {duration: 380, delay: 20 + i * 30, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards'})); } catch (e) {}
  });
}
function moIn(){ // marca la vista ~900 ms tras navegar para que las barras crezcan; render() la quita
  const v = $('#view'); if (moReduce()) return; v.classList.add('mo-in'); clearTimeout(MO.tIn); MO.tIn = setTimeout(() => v.classList.remove('mo-in'), 900);
}
const SCRMEM = {}; // posición de scroll de cada nivel (pestaña + profundidad) para recuperarla al volver con «atrás»
function navTo(mutate, o){
  moEnd();
  const t0 = tab, d0 = (navStack[t0] || []).length;
  try { SCRMEM[t0 + ':' + d0] = $('#view').scrollTop; } catch (e) {}
  mutate && mutate();
  const t1 = tab, d1 = (navStack[t1] || []).length;
  const kind = t1 !== t0 ? (TAB_ORDER.indexOf(t1) > TAB_ORDER.indexOf(t0) ? 'tab-f' : 'tab-b') : d1 > d0 ? 'push' : d1 < d0 ? 'pop' : '';
  const view = $('#view'), top = $('#top'), root = document.documentElement, keep = o && o.keep;
  const fin = () => { render(); if (!keep) $('#view').scrollTop = 0; else if (kind === 'pop') $('#view').scrollTop = SCRMEM[t1 + ':' + d1] || 0; moIn(); };
  if (!kind || moReduce() || document.hidden) return fin();
  const id = ++MO.id;
  if ('startViewTransition' in document) { // camino principal: View Transitions
    root.setAttribute('data-mo', kind);
    let vt;
    try { vt = document.startViewTransition(fin); } catch (e) { root.removeAttribute('data-mo'); return fin(); }
    MO.vt = vt;
    const done = () => { if (MO.id === id) { MO.vt = null; root.removeAttribute('data-mo'); } };
    vt.updateCallbackDone.catch(e => console.error(e));
    vt.ready.then(() => { if (MO.id === id) moStagger(); }, () => {});
    vt.finished.then(done, done);
    MO.timer = setTimeout(() => { if (MO.id === id) moEnd(); }, 1500); // seguro: nunca queda bloqueada
    return;
  }
  // respaldo: copia 'fantasma' de la vista anterior solo al volver atrás (4.10.1: en el resto, sin pantallazo) + animaciones CSS
  if (kind !== 'pop') {
    fin(); root.setAttribute('data-mo', kind); $('#view').classList.add('mo-new'); moStagger();
    const end0 = () => { if (MO.id === id) moEnd(); };
    $('#view').onanimationend = e => { if (e.target === e.currentTarget) end0(); };
    MO.timer = setTimeout(end0, 700); return;
  }
  const ghost = view.cloneNode(true), app = $('#app');
  ghost.removeAttribute('id'); ghost.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  ghost.classList.add('mo-ghost'); ghost.setAttribute('aria-hidden', 'true'); ghost.inert = true;
  ghost.style.top = view.offsetTop + 'px'; ghost.style.height = view.offsetHeight + 'px';
  app.appendChild(ghost); ghost.scrollTop = view.scrollTop; MO.ghosts.push(ghost);
  const cs = getComputedStyle(top), gt = document.createElement('div');
  gt.className = 'mo-gt'; gt.style.padding = `${cs.paddingTop} ${cs.paddingRight} ${cs.paddingBottom} ${cs.paddingLeft}`;
  [...top.childNodes].forEach(k => gt.appendChild(k));
  fin(); top.appendChild(gt); MO.ghosts.push(gt);
  root.setAttribute('data-mo', kind); $('#view').classList.add('mo-new'); top.classList.add('mo-new');
  moStagger();
  const end = () => { if (MO.id === id) moEnd(); };
  $('#view').onanimationend = e => { if (e.target === e.currentTarget) end(); };
  MO.timer = setTimeout(end, 700);
}

/* ---------- Agregados para estadísticas ---------- */
function wReps(w){ let n = 0; w.exercises.forEach(e => e.sets.forEach(s => { n += s.reps || 0; })); return n; }
function muscleSets(ws){ const m = {}; ws.forEach(w => w.exercises.forEach(e => { const k = exOf(e.exId).muscle, n = e.sets.filter(isWork).length; if (n) m[k] = (m[k] || 0) + n; })); return m; }
const groupSets = ms => GROUPS.map(([, ks]) => ks.reduce((a, k) => a + (ms[k] || 0), 0));
function agg(ws){ return {n: ws.length, ms: ws.reduce((a, w) => a + (w.end - w.start), 0), vol: ws.reduce((a, w) => a + wVolume(w), 0), sets: ws.reduce((a, w) => a + wSets(w), 0), reps: ws.reduce((a, w) => a + wReps(w), 0)}; }
const inRange = (a, b) => S.workouts.filter(w => w.start >= a && w.start < b);
function delta(cur, prev, label, neutral){
  if (!prev || prev <= 0 || cur == null) return '';
  const p = (cur - prev) / prev * 100;
  if (Math.abs(p) < 0.5) return `<span class="delta flat">= igual${label ? ' ' + label : ''}</span>`;
  return `<span class="delta ${neutral ? 'flat' : p > 0 ? 'up' : 'down'}">${p > 0 ? '▲' : '▼'} ${fmtN(Math.abs(p), 0)}%${label ? ' ' + label : ''}</span>`;
}
const tile = (val, label, d = '') => `<div class="stat"><b>${val}</b><span>${label}</span>${d || ''}</div>`;
function exBestInSets(sets, type){
  const ws = sets.filter(isWork); if (!ws.length) return null;
  if (type === 'wr') return ws.reduce((a, b) => e1rm(b) > e1rm(a) ? b : a);
  if (type === 'bw') return ws.reduce((a, b) => ((b.reps || 0) + (b.kg || 0) / 10) > ((a.reps || 0) + (a.kg || 0) / 10) ? b : a);
  if (type === 'dur') return ws.reduce((a, b) => (b.sec || 0) > (a.sec || 0) ? b : a);
  return ws.reduce((a, b) => (b.km || 0) > (a.km || 0) ? b : a);
}
function exScore(sets, type){ const b = exBestInSets(sets, type); if (!b) return 0; return type === 'wr' ? e1rm(b) : type === 'bw' ? (b.reps || 0) : type === 'dur' ? (b.sec || 0) : (b.km || 0); }
const scoreUnit = type => type === 'wr' ? ' kg' : type === 'bw' ? ' reps' : type === 'dur' ? ' s' : ' km';
function prevComparable(w){
  return S.workouts.find(x => x.start < w.start && x.id !== w.id && ((w.routineId && x.routineId === w.routineId) || norm(x.title) === norm(w.title))) || null;
}
function workoutNumber(w){ return S.workouts.filter(x => x.start <= w.start).length; }
function calHTML(y, m, opts = {}){
  const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, nd = new Date(y, m + 1, 0).getDate();
  const on = new Set(S.workouts.filter(w => { const d = new Date(w.start); return d.getFullYear() === y && d.getMonth() === m; }).map(w => new Date(w.start).getDate()));
  const today = new Date(), isCur = today.getFullYear() === y && today.getMonth() === m;
  return `<div class="cal">${'LMXJVSD'.split('').map(c => `<div class="h">${c}</div>`).join('')}${'<div></div>'.repeat(lead)}${[...Array(nd)].map((_, i) => `${on.has(i + 1) ? `<button class="d on ${isCur && today.getDate() === i + 1 ? 'today' : ''}" data-act="cal-day" data-y="${y}" data-m="${m}" data-day="${i + 1}" aria-label="Ver entrenos del ${i + 1} de ${MONTHS[m]}">${i + 1}</button>` : `<div class="d ${isCur && today.getDate() === i + 1 ? 'today' : ''}">${i + 1}</div>`}`).join('')}</div>`;
}

function weekProgress(){

  const p = plan(), goal = p ? Math.max(1, planDays(p)) : 4;

/* ---------- Tarjeta de Inicio: racha, meta semanal y rango (aversión a la pérdida + gradiente de objetivo) ---------- */
function weekGoal(){
  const g = +S.settings.weekGoal; if (g >= 1 && g <= 7) return {n: Math.round(g), auto: false};
  const cur = weekStart(Date.now()), by = {};
  S.workouts.forEach(w => { const k = weekStart(w.start); by[k] = (by[k] || 0) + 1; });
  let ks = Object.keys(by).map(Number).filter(k => k < cur).sort((a, b) => b - a).slice(0, 8);
  if (!ks.length) ks = Object.keys(by).map(Number).sort((a, b) => b - a).slice(0, 8);
  if (!ks.length) return {n: 3, auto: true};
  return {n: clamp(Math.round(ks.reduce((a, k) => a + by[k], 0) / ks.length), 2, 6), auto: true};
}
function goalCard(thisWeek){
  const st = weekStreak(), goal = weekGoal(), n = thisWeek.length, done = n >= goal.n;
  const pc = v => Math.max(v > 0 ? 3 : 0, Math.min(100, v)).toFixed(1);
  let top = '';

    const left = 7 - (new Date().getDay() + 6) % 7;
    top = `<div class="gc-risk"><div><b>Tu racha de ${st} semanas está en peligro</b><small>${left === 1 ? 'Se pierde esta noche' : 'Se pierde el domingo · quedan ' + left + ' días'}</small></div>${S.active ? '' : '<button class="btn primary sm" data-act="start-empty">Entrenar ahora</button>'}</div>`;
  } else if (n && st >= 1) top = `<div class="gc-ok">Racha de ${st === 1 ? '1 semana' : st + ' semanas'} a salvo ✓</div>`;

  const R = rkAll(), g = R.glob;
  if (g && g.idx < 24) {

  } else if (!g) {

    h += `<button class="gc-row" data-act="go-ranks"><span class="gc-rk">${rkIcon(-1, 28)}<span class="gc-t"><b>${t}</b>${t2}</span><small class="muted">›</small></span><span class="rk-bar" aria-hidden="true" style="--rk:var(--acc)"><i style="width:${pc(Math.min(R.n, RK.minEx) / RK.minEx * 100)}%"></i></span></button>`;
  }
  return `<div class="card stack gc">${h}</div>`;
}

/* ---------- Estadísticas: fuerza por grupo, chiquipuntos por mes y hábitos (desde 4.5.13) ---------- */

  const c = L.fz.r, p = fuerzaOf(now - (CL.relWeeks + 4) * W, now - 4 * W, L.bw).r;

}
// Chiquipuntos ganados por mes (últimos 12 meses; el mes en curso, rayado)

function habitsCard(ws){

  if (SEC === 'act') {

      const d0 = new Date(from); let k = d0.getFullYear() * 12 + d0.getMonth(); const kEnd = new Date().getFullYear() * 12 + new Date().getMonth();
      k = Math.max(k, kEnd - 35);
      for (; k <= kEnd; k++) { const s = new Date(Math.floor(k / 12), k % 12, 1).getTime(), e = new Date(Math.floor(k / 12), k % 12 + 1, 1).getTime(); buckets.push({label: MON3[k % 12], s, e}); }

    }

    const fmt = M === 'vol' ? (v, ax) => ax ? axT(v) : fmtKg(v) : M === 'dur' ? (v, ax) => fmtN(v, 1) + (ax ? '' : ' h') : v => fmtN(v, 0);
    const full = items.filter(i => !i.partial), lastPart = items.length > 0 && items[items.length - 1].partial, avg = full.length ? full.reduce((s, i) => s + i.v, 0) / full.length : 0;
    h += `<div class="card stack"><div class="st-h"><h3>Evolución ${byMonth ? 'mensual' : 'semanal'}</h3><div class="small muted">Cuánto has entrenado en cada ${byMonth ? 'mes' : 'semana'}. Elige la medida.</div></div><div class="seg sm">${[['vol', 'Volumen'], ['dur', 'Horas'], ['sets', 'Series'], ['n', 'Entrenos']].map(([k, l]) => `<button data-act="st-metric" data-k="${k}" aria-pressed="${M === k}">${l}</button>`).join('')}</div>${barChart(items, fmt)}<div class="small muted">${full.length ? `Media: <b>${fmt(avg)}</b> por ${byMonth ? 'mes' : 'semana'}${lastPart ? ' completo' : ''}.` : ''}${lastPart ? ` La barra rayada es ${byMonth ? 'el mes' : 'la semana'} en curso: aún no ha terminado.` : ''}</div></div>`;

/* ---------- Informe mensual ---------- */
// Resumen del mes en 2-3 frases que no repiten lo que ya dicen las teselas y las tarjetas de debajo; el texto varía según los datos
function monthStory(cur, a, p, ym, nowYm, prs){
  const m = ym % 12, pick = (...v) => v[(ym + cur.length) % v.length], out = [], pm = MONTHS[(m + 11) % 12];
  if (!p) out.push(pick('Tu primer mes con entrenos registrados: buen comienzo.', 'Aquí empieza tu historial: este es tu primer mes en Hierro.'));
  else {
    const fr = ym === nowYm ? Math.max(0.2, new Date().getDate() / new Date(ym > 0 ? Math.floor(ym / 12) : 0, m + 1, 0).getDate()) : 1, r = p.vol > 0 ? a.vol / (p.vol * fr) : p.n > 0 ? a.n / (p.n * fr) : 1; // el mes en curso se compara al mismo ritmo
    out.push(r >= 1.25 ? pick(`Mes de subida frente a ${pm}: has apretado bastante más.`, `Mucha más carga que en ${pm}.`) : r >= 1.05 ? pick(`Algo por encima de ${pm}.`, `Un pasito adelante respecto a ${pm}.`) : r > 0.95 ? pick(`Ritmo casi idéntico al de ${pm}.`, `Muy en la línea de ${pm}.`) : r > 0.75 ? pick(`Un poco más suave que ${pm}.`, `Algo por debajo de ${pm}; también se progresa descansando.`) : pick(`Mes tranquilo comparado con ${pm}.`, `Bastante menos carga que en ${pm}.`));
  }
  const byEx = {}; prs.forEach(pr => { byEx[pr.exId] = (byEx[pr.exId] || 0) + 1; });
  const topEx = Object.entries(byEx).sort((x, y) => y[1] - x[1])[0];
  if (topEx) out.push(Object.keys(byEx).length === 1 ? `Los chiquipuntos del mes vienen de ${exOf(topEx[0]).name}.` : pick(`Donde más has progresado: ${exOf(topEx[0]).name}.`, `${exOf(topEx[0]).name} se lleva la palma en marcas nuevas.`));
  else if (cur.length > 1) { const b = cur.reduce((x, y) => wVolume(y) > wVolume(x) ? y : x); out.push(`Tu sesión más pesada fue «${b.title || 'Entreno'}», el ${fmtDate(b.start, false)}.`); }
  const dow = new Array(7).fill(0); cur.forEach(w => dow[(new Date(w.start).getDay() + 6) % 7]++);
  const dm = Math.max(...dow), DN = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
  if (cur.length >= 4 && dow.filter(v => v === dm).length === 1) out.push(`Tu día fuerte: el ${DN[dow.indexOf(dm)]}.`);
  return out.join(' ') + (ym === nowYm ? ' El mes aún no ha terminado.' : '');
}
function viewMonth(ym){
  const y = Math.floor(ym / 12), m = ym % 12;
  const s = new Date(y, m, 1).getTime(), e = new Date(y, m + 1, 1).getTime(), ps = new Date(y, m - 1, 1).getTime();
  const cur = inRange(s, e), prev = inRange(ps, s), a = agg(cur), p = prev.length ? agg(prev) : null;
  const nowYm = new Date().getFullYear() * 12 + new Date().getMonth();
  let h = `<div class="row between"><button class="iconbtn" data-act="go-month" data-ym="${ym - 1}" data-replace="1" aria-label="Mes anterior">${ICON.back}</button><h2>${monthName(m)} ${y}</h2><button class="iconbtn" data-act="go-month" data-ym="${ym + 1}" data-replace="1" aria-label="Mes siguiente" style="transform:scaleX(-1)" ${ym >= nowYm ? 'disabled' : ''}>${ICON.back}</button></div>`;
  if (!cur.length) return h + `<div class="empty">${EI('🗓️')}<h3>Mes sin entrenos</h3><div>No hay entrenos en ${MONTHS[m]} de ${y}.</div><button class="btn primary" data-act="tab" data-tab="train">Empezar un entreno</button></div>`;
  h += `<div class="card stack"><div class="stats4">${tile(a.n, 'Entrenos', delta(a.n, p && p.n))}${tile(fmtDurC(a.ms), 'Tiempo', delta(a.ms, p && p.ms))}${tile(fmtKg(a.vol), 'Volumen', delta(a.vol, p && p.vol))}${tile(a.sets, 'Series', delta(a.sets, p && p.sets))}</div><div class="small muted">${monthStory(cur, a, p, ym, nowYm, cur.flatMap(w => w.prs || []))}</div></div>`;
  const months = [...Array(6)].map((_, i) => { const k = ym - 5 + i, ss = new Date(Math.floor(k / 12), k % 12, 1).getTime(), ee = new Date(Math.floor(k / 12), k % 12 + 1, 1).getTime(); return {label: MON3[k % 12], partial: ee > Date.now(), v: agg(inRange(ss, ee)).vol}; });
  h += `<div class="card stack"><h3>Volumen de los últimos 6 meses</h3>${barChart(months, (v, ax) => ax ? axT(v) : fmtKg(v), null, 1, 'Volumen de los últimos 6 meses')}</div>`;
  const prs = []; cur.forEach(w => (w.prs || []).forEach(pr => prs.push({...pr, w})));
  const best = {}; prs.forEach(pr => { const k = pr.exId + pr.kind; if (!best[k] || pr.val > best[k].val) best[k] = pr; });
  const prl = Object.values(best).sort((x, y2) => y2.w.start - x.w.start);
  h += `<div class="card stack"><div class="row between"><h3>Chiquipuntos del mes</h3><span class="pill gold">${prl.length}</span></div>${prl.length ? prl.slice(0, 12).map(pr => `<button class="recrow" data-act="open-workout" data-id="${pr.w.id}"><span>${esc(exOf(pr.exId).name)}<small>${pr.label} · ${fmtDate(pr.w.start, false)}</small></span><b class="pr num">${pr.txt}</b></button>`).join('') : '<div class="small muted">Este mes no hubo chiquipuntos nuevos.</div>'}</div>`;
  const nd = new Set(cur.map(w => new Date(w.start).getDate())).size;
  h += `<div class="card stack"><div class="row between"><h3>Constancia</h3><span class="small muted">${nd} de ${ym === nowYm ? new Date().getDate() : new Date(y, m + 1, 0).getDate()} días</span></div>${calHTML(y, m)}</div>`;
  const mc = muscleSets(cur), mp = muscleSets(prev);
  h += `<div class="card stack"><h3>Reparto muscular</h3><div class="small muted">${p ? `Discontinuo: ${MONTHS[(m + 11) % 12]}.` : ''}</div>${radar(groupSets(mc), p ? groupSets(mp) : null)}<div class="bm-lg">${bodyMap(mc)}</div></div>`;
  const ex = {}; cur.forEach(w => w.exercises.forEach(e2 => { ex[e2.exId] = (ex[e2.exId] || 0) + 1; }));
  const top = Object.entries(ex).sort((x, y2) => y2[1] - x[1]).slice(0, 6);
  h += `<div class="card stack"><h3>Lo que más has hecho</h3>${top.map(([id, n], i) => `<button class="exrow" data-act="open-ex" data-id="${id}"><div><b>${i + 1}. ${esc(exOf(id).name)}</b><small>${n} ${n === 1 ? 'sesión' : 'sesiones'}</small></div></button>`).join('')}</div>`;
  return h;
}

function startWorkout(from){

  if (from) w.exercises = from.exercises.map((e, ri) => {

    return {uid: rid(), ...(w.routineId ? {ri} : {}), exId: e.exId, notes: '', rest: e.rest ?? null, ss: e.ss || null, sets: e.sets.map((s, i) => {

/* ---------- Temporizador de descanso ---------- */
let REST = null, restTimer = null, audioCtx = null;
function unlockAudio(){ try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
// iPhone: no deja vibrar desde la web; el interruptor de silencio corta el sonido salvo que pidamos sesión de audio «transient» (para avisos cortos, baja la música en vez de pararla)
function haptic(n = 1){
  if (navigator.vibrate) { try { navigator.vibrate(n > 1 ? [220, 90, 220, 90, 320] : 12); } catch (e) {} return; }
  for (let k = 0; k < n; k++) setTimeout(() => { try { const l = document.createElement('label'), i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.style.display = 'none'; l.appendChild(i); document.body.appendChild(l); l.click(); l.remove(); } catch (e) {} }, k * 180);
}
function beep(){
  if (!S.settings.sound) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'transient'; } catch (e) {}
  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); const t = audioCtx.currentTime + .05; [0, .25, .5, .9, 1.15].forEach((d, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'triangle'; o.frequency.value = i % 3 === 2 ? 1320 : 990; g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.8, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .2); o.connect(g).connect(audioCtx.destination); o.start(t + d); o.stop(t + d + .22); }); } catch (e) {}
  haptic(3);
}
const notifOK = () => 'Notification' in window && Notification.permission === 'granted' && S.settings.notif !== false && 'serviceWorker' in navigator;
/* Siguiente serie pendiente del entreno en curso, para los avisos de la pantalla de bloqueo (desde 4.5.6):
   {name, n, total, val: '35 kg × 10 reps'}; usa lo apuntado o, si está vacía, lo sugerido (rutina o última vez). */
function nextSetInfo(){
  const W = ED && ED.mode === 'active' ? ED.data : S.active; if (!W || !W.exercises) return null;
  for (const e of W.exercises) {
    const si = e.sets.findIndex(s => !s.done); if (si < 0) continue;
    const x = exOf(e.exId), s = e.sets[si]; let ph = {}; try { ph = (ED && ED.mode === 'active' ? phFor(e, si) : s.ph) || {}; } catch (err) {}
    const v = f => s[f] != null && s[f] !== '' ? s[f] : ph[f];
    const kg = v('kg'), reps = v('reps'), sec = v('sec'), km = v('km'), min = v('min');
    const val = x.type === 'dur' ? (sec ? fmtClock(sec) : '') : x.type === 'cardio' ? [km ? fmtN(km, 2) + ' km' : '', min ? fmtN(min) + ' min' : ''].filter(Boolean).join(' · ')
      : [kg ? fmtN(kg, 2) + ' kg' : '', reps ? reps + ' reps' : ''].filter(Boolean).join(' × ');
    // Como en la tabla: el calentamiento no cuenta (Serie 1 de 4 tras un calentamiento).
    return {name: x.name, w: s.t === 'w', n: e.sets.slice(0, si + 1).filter(isWork).length, total: e.sets.filter(isWork).length, val};
  }
  return null;
}
const nextSetText = nx => nx ? `${nx.name} · ${nx.w ? 'Calentamiento' : `Serie ${nx.n} de ${nx.total}`}${nx.val ? ' · ' + nx.val : ''}` : '';
// El aviso fijo al bloquear el móvil («Descanso · termina a las…», 4.5.6) se quitó en 4.5.11 a petición de Guillermo.
// Esto solo cierra el que pudiera quedar de una versión anterior; el aviso de fin de descanso sigue igual.
function restLockNotif(){
  if (!('serviceWorker' in navigator) || !('Notification' in window) || Notification.permission !== 'granted') return;
  navigator.serviceWorker.ready.then(r => r.getNotifications({tag: 'hierro-rest'}).then(ns => ns.forEach(n => n.close()))).catch(() => {});
}
function notifyRestEnd(name){

  navigator.serviceWorker.ready.then(r => r.showNotification('¡Descanso terminado!', {body: nx ? 'Ahora: ' + nextSetText(nx) : 'A por la siguiente serie' + (name ? ' · ' + name : ''), tag: 'hierro-descanso', renotify: true, requireInteraction: false, silent: false, vibrate: [300, 120, 300, 120, 400], icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', data: {url: location.href.split('#')[0]}})).catch(() => {});
}
// Avisos con la pantalla bloqueada: un pequeño servidor (Cloudflare, ver push/LEEME) manda la notificación a la hora justa
const Push = {
  key: 'BGvDf0vxpoJXJQVZJAgTaLAXB_8HVcLiPVYVwlQYfrP1ESWK88xCU0y6FXVV1Y9QitpN9QL7EXpw6MO7d8Qv_ZM',
  at: null, okAt: null, sub: null,
  url(){ return ((window.HIERRO_CONFIG || {}).pushUrl || '').replace(/\/$/, ''); },
  ok(){ return !!this.url() && notifOK() && 'PushManager' in window; },
  async getSub(){
    if (this.sub) return this.sub;

    let s = await reg.pushManager.getSubscription();
    if (!s) { const k = atob(this.key.replace(/-/g, '+').replace(/_/g, '/')), u = new Uint8Array(k.length); for (let i = 0; i < k.length; i++) u[i] = k.charCodeAt(i); s = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: u}); }
    return this.sub = s;
  },
  async call(path, body){ const s = await this.getSub(); const r = await fetch(this.url() + path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({sub: s.toJSON(), ...body}), keepalive: true}); if (!r.ok) throw new Error('push ' + r.status); },

    const prev = this.at; this.at = want;
    if (want) { const name = REST.name, nx = REST.next; this.call('/schedule', {at: want, body: nx ? 'Ahora: ' + nextSetText(nx) : 'A por la siguiente serie' + (name ? ' · ' + name : '')}).then(() => { if (this.at === want) this.okAt = want; }, e => console.warn(e)); }

  }
};
async function askNotif(){

  S.settings.notif = p === 'granted'; S.settings.notifAsked = true; Store.mark('meta');

/* ---------- Mensajes de motivación («Coach») ----------
   El servidor de avisos (push/worker.js, clase Coach) guarda un registro por móvil con tu plan, tu último entreno y tu racha,
   y a ciertas horas te manda un empujón («Hoy toca…», «Vamos vago…»). Ajuste en S.settings.coach = {on, level} (se sincroniza).
   Por defecto está activo solo si ya diste permiso de notificaciones. El registro se sube (sin esperar) cuando cambia algo:
   al abrir la app, al guardar un entreno, al cambiar el plan o el ajuste; la huella de lo último subido va en localStorage. */
const Coach = {
  LS: 'hierro.coach', seen: false, busy: false, again: false,
  cfg(){ const c = S.settings.coach || {}; return {on: typeof c.on === 'boolean' ? c.on : null, level: c.level === 'suave' ? 'suave' : 'picante'}; },
  perm(){ return 'Notification' in window && Notification.permission === 'granted'; },
  on(){ const c = this.cfg(); return this.perm() && c.on !== false; },
  name(){ const n = (Cloud.session && Cloud.session.name) || (S.settings.social && S.settings.social.username) || ''; return String(n).trim().split(/\s+/)[0].slice(0, 30); },
  body(){
    const p = plan(), idx = [0, 1, 2, 3, 4, 5, 6], rs = idx.map(i => planRoutines(p, i));
    return {tz: Intl.DateTimeFormat().resolvedOptions().timeZone, name: this.name(), days: rs.map(l => l.length > 0), routines: rs.map(l => planNames(l).slice(0, 40)),
      last: S.workouts.reduce((m, w) => Math.max(m, w.start || 0), 0), streak: weekStreak(), level: this.cfg().level, enabled: true};
  },
  async sync(){
    if (!Push.url() || Store.key === 'nouser' || !('serviceWorker' in navigator)) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try {
      const prev = localStorage.getItem(this.LS);
      if (!this.on()) { if (prev && prev !== 'off') { await Push.call('/coach/off', {}); localStorage.setItem(this.LS, 'off'); } return; }
      if (!('PushManager' in window)) return;
      const b = this.body(), h = hashOf({e: (await Push.getSub()).toJSON().endpoint, b});
      if (h === prev && this.seen) return; // sin cambios: solo se vuelve a subir una vez por arranque
      await Push.call('/coach', b); localStorage.setItem(this.LS, h); this.seen = true;
    } catch (e) { console.warn('coach', e); }
    finally { this.busy = false; if (this.again) { this.again = false; this.sync(); } }
  },
  async set(on){
    if (on && !this.perm() && !(await askNotif())) return false;
    S.settings.coach = {on, level: this.cfg().level}; Store.mark('meta'); render(); this.sync();
    toast(on ? 'Mensajes de motivación activados 💪' : 'Mensajes de motivación desactivados'); return on;
  },
  level(v){ S.settings.coach = {on: this.on(), level: v === 'suave' ? 'suave' : 'picante'}; Store.mark('meta'); render(); this.sync(); }
};

/* ---------- Importar CSV ---------- */
function parseCSV(text){
  const firstLine = text.slice(0, text.indexOf('\n') > -1 ? text.indexOf('\n') : text.length);
  const D = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === D) { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ''));
}
const MONMAP = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,ene:0,abr:3,ago:7,dic:11,set:8};
function parseCSVDate(s){
  s = String(s || '').trim(); if (!s) return null;
  // formato de 12 horas («6:30 PM», «6:30 p. m.»): se pasa a 24 h antes de leer la fecha
  const ap = s.match(/(\d{1,2})(:\d{2}(?::\d{2})?)\s*([ap])\.?\s*m\.?\s*$/i);
  if (ap) { let h = +ap[1] % 12; if (/p/i.test(ap[3])) h += 12; s = s.slice(0, ap.index) + h + ap[2]; }
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime();
  m = s.match(/^(\d{1,2})\s+(?:de\s+)?([A-Za-zÀ-ÿ\.]+)\s+(?:de\s+)?(\d{4}),?\s+(\d{1,2}):(\d{2})/);
  if (m) { const mon = MONMAP[norm(m[2]).slice(0, 3)]; if (mon != null) return new Date(+m[3], mon, +m[1], +m[4], +m[5]).getTime(); }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s+(\d{1,2}):(\d{2})/);
  if (m) return new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5]).getTime();
  const t = Date.parse(s); return isNaN(t) ? null : t;
}
// Duración razonable: si en la app de origen se quedó el entreno abierto (horas) o se cerró al momento (1 min), se estima por las series
function estDuration(w){ const n = w.exercises.reduce((a, e) => a + e.sets.length, 0); return Math.min(150, Math.max(20, Math.round(n * 3))) * 60000; }
function fixDuration(w){
  const d = w.end - w.start, n = w.exercises.reduce((a, e) => a + e.sets.length, 0);
  if (d > 6 * 36e5 || (d < 5 * 60000 && n >= 4)) { w.end = w.start + estDuration(w); return true; }
  return false;
}
function fixDurations(){ let n = 0; for (const w of S.workouts) if (fixDuration(w)) n++; if (n) Store.mark(); return n; }
function guessMuscle(name){
  const n = norm(name);
  // de lo más concreto a lo más general (p. ej. «Curl de piernas» antes que «curl», «Jalón al pecho» antes que «pecho»)
  const R = [[/\b(run|correr|carrera|treadmill|cinta|bike|bici|cycl|elliptic|eliptica|escaladora|stair|andar|walk|camin|swim|nadar|cuerdas de batalla|battle rope|comba|jump rope|cardio|row machine|remoergometro)/, 'cardio'],
    [/shrug|encogim|trapec/, 'trapecio'],
    [/crunch|abdominal|plank|plancha|ab wheel|rueda|leg raise|elevacion de (piernas|rodillas)|rodillas al pecho|knee raise|twist|giro ruso|pallof|core|sit up|hollow|oblicu/, 'abdominales'],
    [/back extension|hiperext|hyperext|lumbar|extension de espalda/, 'lumbares'],
    [/calf|gemel|pantorr/, 'gemelos'], [/abduc/, 'abductores'], [/adduc|aduc/, 'aductores'],
    [/hip thrust|empuje de cadera|glute|glut|patada de glu|puente/, 'gluteos'],
    [/leg curl|curl de pierna|curl femoral|femoral|romanian|rumano|good morning|buenos dias|isquio|hamstring|nordic/, 'isquios'],
    [/squat|sentadill|leg press|prensa|press de pierna|press a una pierna|leg extension|extension de pierna|extension de cuadr|cuadricep|lunge|zancad|step up|step down|subida al cajon|hack|bulgar/, 'cuadriceps'],
    [/tricep|pushdown|skull|frances|\bdips?\b|fondo|kickback/, 'triceps'], [/curl|bicep/, 'biceps'],
    [/lateral|shoulder|hombro|overhead press|military|militar|arnold|rear delt|vuelos posteriores|pajaro|face pull|front raise|elevacion frontal|elevacion en y|remo al menton|upright row/, 'hombros'],
    [/row|remo|pulldown|jalon|pull up|dominad|chin up|\blat\b|dorsal|pullover|deadlift|peso muerto/, 'espalda'],
    [/bench|banca|chest|pecho|fly|apertura|cruzad|crossover|push up|flexion|pec deck|mariposa/, 'pecho'],
    [/wrist|muneca|forearm|antebrazo|farmer/, 'antebrazo']];
  for (const [re, k] of R) if (re.test(n)) return k;
  return 'completo';
}
// Ejercicios propios creados al importar un CSV en castellano antes de la 4.5.2: se vuelve a calcular su músculo una vez
function fixImportedMuscles(){
  const mig = S.settings.mig || {}; if (mig.mus) return 0;
  let n = 0;
  for (const c of S.customEx) if (c.equip === 'otro' && !(c.aliases || []).length) {
    const g = guessMuscle(c.name); if (g !== 'completo' && g !== c.muscle) { c.muscle = g; n++; }
  }
  S.settings.mig = {...mig, mus: 1}; if (n) rebuildEx(); Store.mark('meta'); return n;

// Ejercicios propios que en realidad son del catálogo (importados de un CSV en castellano antes de la 4.5.3): se cambian por el
// del catálogo en entrenos, rutinas y entreno en curso, y se borra el propio. Los que no tienen equivalente se marcan como importados.
function mergeImportedEx(){
  const mig = S.settings.mig || {}; if (mig.hevy) return 0;
  const idx = new Map(); LIB.forEach(e => { idx.set(norm(e.name), e.id); e.aliases.forEach(a => idx.set(norm(a), e.id)); });
  for (const [es, en] of ES_NAMES_MAP) if (!idx.has(es) && idx.has(en)) idx.set(es, idx.get(en));
  const map = new Map();
  for (const c of S.customEx) {
    if (c.equip !== 'otro' || (c.aliases || []).length) continue; // los creados a mano (con equipo elegido) no se tocan
    const to = idx.get(norm(c.name));
    if (to && exMap.get(to) && exMap.get(to).type === c.type) map.set(c.id, to);
    else { c.src = 'hevy'; const q = guessEquip(c.name); if (q !== 'otro') c.equip = q; }
  }
  const fix = list => (list || []).forEach(e => { if (map.has(e.exId)) e.exId = map.get(e.exId); });
  for (const w of S.workouts) { fix(w.exercises); fix(w.prs); }
  for (const r of S.routines) fix(r.exercises);
  if (S.active) fix(S.active.exercises);
  S.customEx = S.customEx.filter(c => !map.has(c.id));
  S.settings.mig = {...mig, hevy: 1}; rebuildEx(); Store.mark('meta'); return map.size;
}
function exIndex(){
  const idx = new Map(); allEx().forEach(e => { idx.set(norm(e.name), e.id); e.aliases.forEach(a => idx.set(norm(a), e.id)); });
  for (const [es, en] of ES_NAMES_MAP) if (!idx.has(es) && idx.has(en)) idx.set(es, idx.get(en));
  return idx;
}
function importWorkoutsCSV(text){
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error('El archivo está vacío.');
  const H = rows[0].map(h => norm(h).replace(/ /g, '_'));

/* 4.10.2: «Actualizar la rutina con lo de hoy». Los ejercicios (y las series) de la rutina que no hiciste se quedan
   como estaban; lo que hiciste actualiza sus series; lo que añadiste entra en su sitio; lo que quitaste del entreno sale de la rutina.
   w = entreno en curso (con las series sin marcar y `ri` = posición en la rutina), r = rutina de origen. */
function routineMerge(w, r){
  const used = new Set(), out = [];
  const setOf = s => ({t: s.t || 'n', kg: s.kg ?? null, reps: s.reps ?? null, sec: s.sec ?? null, km: s.km ?? null, min: s.min ?? null});
  w.exercises.forEach(e => {
    let bi = Number.isInteger(e.ri) && !used.has(e.ri) && r.exercises[e.ri] && r.exercises[e.ri].exId === e.exId ? e.ri : -1;
    if (bi < 0) bi = r.exercises.findIndex((x, i) => !used.has(i) && x.exId === e.exId);
    const base = bi >= 0 ? r.exercises[bi] : null; if (base) used.add(bi);
    const type = exOf(e.exId).type, isDone = s => s.done && hasData(s, type);
    if (!e.sets.some(isDone)) { if (base) out.push(clone(base)); return; } // no lo hiciste: se queda como estaba
    const sets = e.sets.map((s, i) => isDone(s) ? setOf(s) : base && base.sets[i] ? clone(base.sets[i]) : null).filter(Boolean);
    out.push({exId: e.exId, rest: e.rest ?? (base ? base.rest ?? null : null), notes: base ? base.notes || '' : '', ss: e.ss || null, sets});
  });
  fixSS(out);
  return {id: r.id, name: r.name, notes: r.notes || '', exercises: out, kept: out.length - w.exercises.filter(e => e.sets.some(s => s.done && hasData(s, exOf(e.exId).type))).length};
}
// Respaldo (sin el entreno en curso): se parte de la rutina, se actualizan los ejercicios hechos y se añaden los nuevos al final
function routineMergeSaved(w, r){
  const ex = w.exercises.map(e => ({...e, sets: e.sets.map(s => ({...s, done: true}))}));
  const used = new Set(), act = {exercises: []};
  r.exercises.forEach((x, ri) => { const j = ex.findIndex((e, k) => !used.has(k) && e.exId === x.exId); if (j >= 0) { used.add(j); act.exercises.push({...ex[j], ri}); } else act.exercises.push({exId: x.exId, ri, sets: []}); });
  ex.forEach((e, k) => { if (!used.has(k)) act.exercises.push(e); });
  return routineMerge(act, r);
}
/* 4.10.2: rutina a partir de varios entrenos con el mismo nombre (el más reciente primero). Parte del último y añade, en su sitio,
   los ejercicios que salieron en los anteriores y ese día no hiciste (la rutina original los conservaba). */
function routineFromWorkouts(ws, name){
  const base = routineFromWorkout(ws[0], name), have = new Set(base.exercises.map(e => e.exId));
  ws.slice(1).forEach(w => w.exercises.forEach((e, i) => {
    if (have.has(e.exId)) return;
    const one = routineFromWorkout({exercises: [e]}).exercises[0]; one.ss = null;
    let at = base.exercises.length;
    for (let k = i - 1; k >= 0; k--) { const j = base.exercises.findIndex(x => x.exId === w.exercises[k].exId); if (j >= 0) { at = j + 1; break; } }
    base.exercises.splice(at, 0, one); have.add(e.exId);
  }));

}
function routineFromWorkout(w, name){
  return {id: rid(), name: name || w.title || 'Rutina', notes: '', exercises: w.exercises.map(e => ({exId: e.exId, rest: e.rest ?? null, notes: '', ss: e.ss || null, sets: e.sets.map(s => ({t: s.t, kg: s.kg ?? null, reps: s.reps ?? null, sec: s.sec ?? null, km: s.km ?? null, min: s.min ?? null}))}))};
}

async function saveFile(filename, data, mime){
  const blob = new Blob([data], {type: mime});
  // En el móvil, el menú de compartir permite guardarlo en Archivos, Drive, WhatsApp…
  try {
    const file = new File([blob], filename, {type: mime});
    if (IS_MOBILE && navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: filename}); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  } catch (e) { toast('No se ha podido guardar el archivo'); return false; }
}
function toCSV(){
  const head = ['title','start_time','end_time','description','exercise_title','superset_id','exercise_notes','set_index','set_type','weight_kg','reps','distance_km','duration_seconds'];
  // 4.9.1: un texto que empieza por = + - @ se trata como fórmula en Excel (un entreno copiado de otro podía colarla): se antepone '
  const q = v => { const txt = typeof v === 'string'; v = v == null ? '' : String(v); if (txt && /^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const dt = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:00`; };
  const T = {n: 'normal', w: 'warmup', f: 'failure', d: 'dropset'};
  const lines = [head.join(',')];
  S.workouts.slice().reverse().forEach(w => w.exercises.forEach(e => e.sets.forEach((s, i) => lines.push([w.title, dt(w.start), dt(w.end), w.notes, exOf(e.exId).name, e.ss ? e.ss.replace(/^s/, '') : '', e.notes, i, T[s.t], s.kg, s.reps, s.km, s.sec != null ? s.sec : s.min != null ? Math.round(s.min * 60) : ''].map(q).join(',')))));
  return lines.join('\n');
}

const fsv = v => {
  if (v === null || v === undefined) return {nullValue: null};
  if (typeof v === 'boolean') return {booleanValue: v};
  if (typeof v === 'number') return Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
  if (typeof v === 'string') return {stringValue: v};
  if (Array.isArray(v)) return {arrayValue: {values: v.map(fsv)}};
  return {mapValue: {fields: Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fsv(x)]))}};
};
const jsv = v => {
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return +v.integerValue;
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return Date.parse(v.timestampValue);
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(jsv);
  if ('mapValue' in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, jsv(x)]));

  async 'acc-delete'(){
    const txt = 'Se borrarán tu cuenta y <b>todos tus datos</b>, en la nube y en este móvil: entrenos, rutinas, medidas, publicaciones y seguidores, '
      + 'y también tus comentarios, tus me gusta y tus mensajes en lo de otras personas. No se puede deshacer. Si quieres conservar tus entrenos, descarga antes una copia.';
    const ok = await ask('Eliminar cuenta', txt, [['0', 'Cancelar'], ['1', 'Eliminar para siempre', 'danger']]);
    closeModal(); if (ok !== '1') return;
    toast('Eliminando…');
    try { await Cloud.deleteEverything(); await signOutLocal(); showAuth('✓ Tu cuenta y tus datos se han eliminado.'); }
    catch (e) {
      if (e.traces) {
        const go = await ask('No se pudo borrar todo', esc(e.message) + ' Puedes intentarlo más tarde o borrar ya la cuenta y el resto de tus datos (lo que quede lo borramos a mano si escribes a soporte.hierro.app@gmail.com).', [['0', 'Más tarde'], ['1', 'Borrar igualmente', 'danger']]);
        closeModal(); if (go !== '1') return;
        try { await Cloud.deleteEverything(true); await signOutLocal(); showAuth('✓ Tu cuenta y tus datos se han eliminado.'); return; } catch (e2) { e = e2; }
      }
      ask('No se pudo eliminar', esc(e.offline ? 'Necesitas conexión a internet.' : (e.message || 'Inténtalo otra vez.')), [['ok', 'Vale']]).then(closeModal); }
  },

/* =========================================================
   Relaciones entre clanes: alianzas y piques

     {a, b, type: 'alianza'|'pique', status: 'pendiente'|'activa', from (clan que propone), by (su jefe), created, accepted?, msg?}
   clanrels/{cid}: {allies: [cid…], rivals: [cid…], last}: las relaciones activas de cada clan. Las reglas solo dejan activar una
     relación si a la vez entra en las listas de los dos clanes, y cada lista tiene como mucho 5: el límite lo garantiza el servidor.
   relations/{id}/msgs/{mid}: muro de piques {uid, name, clan, text, ts}; escriben los miembros de los dos clanes.

const REL = {max: 5, msg: 120, text: 140, wall: 30};

const TAUNTS = ['¿Eso es todo lo que tenéis? 😏', 'Os vemos por el retrovisor 👋', 'Menos excusas y más sentadillas 🏋️', 'Calentad bien, que vamos a por todas 🔥', 'El domingo se cuentan los puntos 😎', '¿Habéis venido a entrenar o a haceros fotos? 📸'];

// Escritura en la lista de relaciones activas de un clan (añadir o quitar x). «last» dice a las reglas qué clan cambia.
const relLink = (cid, x, f, add) => ({update: {name: Cloud.name('clanrels', cid), fields: fsFields({last: x})}, updateMask: {fieldPaths: ['last']}, updateTransforms: [{fieldPath: f, [add ? 'appendMissingElements' : 'removeAllFromArray']: {values: [fsv(x)]}}]});

  uid: null, cid: null, list: [], links: null, gone: new Set(), sf: new Set(), walls: new Map(), loaded: false, loading: false, err: null, denied: false, at: 0, allAll: false,
  check(){ const u = Social.myUid() || null, c = Clan.myCid(); if (this.uid !== u || this.cid !== c) Object.assign(this, {uid: u, cid: c, list: [], links: null, gone: new Set(), sf: new Set(), walls: new Map(), loaded: false, loading: false, err: null, denied: false, at: 0, allAll: false}); },
  other(r){ return r.a === this.cid ? r.b : r.a; },
  clan(id){ return Clan.clans.find(c => c._id === id) || null; },
  get(id){ return this.list.find(r => r._id === id) || null; },
  // relaciones de mi clan con clanes que existen
  live(){ return this.cid ? this.list.filter(r => (r.a === this.cid || r.b === this.cid) && !this.gone.has(this.other(r)) && this.clan(this.other(r))) : []; },
  with(cid){ return this.live().find(r => this.other(r) === cid) || null; },
  active(type){ return this.live().filter(r => r.status === 'activa' && r.type === type); },
  incoming(){ return this.live().filter(r => r.status === 'pendiente' && r.from !== this.cid); },
  outgoing(type){ return this.live().filter(r => r.status === 'pendiente' && r.from === this.cid && (!type || r.type === type)); },
  owner(){ const c = Clan.mine(); return !!c && c.owner === Social.myUid(); },

  async load(force){

    this.loading = true; this.sf = new Set();

      const q = f => Cloud.queryRoot({from: [{collectionId: 'relations'}], where: ff(f, 'EQUAL', cid), limit: 60});

      else { this.err = e.offline ? 'Sin conexión: no se pueden ver los piques ni las alianzas.' : 'No se han podido cargar los piques y alianzas.'; if (!e.offline) console.warn('rel', e); }

  async scoresOf(clans){

    for (let i = 0; i < need.length; i += 100) {
      const part = need.slice(i, i + 100);
      const res = await Cloud.fs('POST', Cloud.root() + ':batchGet', {documents: part.map(u => Cloud.name('scores', u))});
      (res || []).forEach(r => { if (r.found) { const d = docData(r.found); Clan.scores.set(d._id, d); } });

  },
  async ensure(c){ if (!c || this.sf.has(c._id)) return; this.sf.add(c._id); try { await this.scoresOf([c]); } catch (e) {} clanRender(); },
  // El jefe arregla lo que haya quedado colgando (clanes borrados, listas desfasadas). Sin prisa y sin avisar.
  async heal(){
    if (!this.owner() || this.healing || this.denied) return; this.healing = true;
    try {
      for (const r of this.list) if (this.gone.has(this.other(r))) await Cloud.commit([{delete: Cloud.name('relations', r._id)}]).catch(() => {});
      const L = this.links || {};
      for (const t of ['alianza', 'pique']) { const f = REL_T[t][2]; for (const x of L[f] || []) if (!this.list.some(r => this.other(r) === x && r.type === t && r.status === 'activa' && !this.gone.has(x))) await Cloud.commit([relLink(this.cid, x, f, false)]).catch(() => {}); }

  async count(cid, type){ const d = await Cloud.getDoc('clanrels', cid); return d ? (docData(d)[REL_T[type][2]] || []).length : 0; },
  fail(e, what){ toast(e.offline ? 'Necesitas conexión' : e.status === 403 ? 'No tienes permiso para hacer eso' : `No se ha podido ${what}`); },
  async propose(type, cid, msg){

    if (this.with(cid)) { toast('Ya tenéis una relación con ese clan'); return false; }
    if (this.active(type).length >= REL.max) { toast(`Ya tenéis ${REL.max} ${REL_T[type][3]}: termina una antes`); return false; }
    try { if (await this.count(cid, type) >= REL.max) { toast(`${oc.emoji} ${oc.name} ya tiene ${REL.max} ${REL_T[type][3]}`); return false; } } catch (e) { this.fail(e, 'enviar'); return false; }
    const [a, b] = [mc._id, cid].sort(), id = a + '_' + b, me = Social.myUid();

  async accept(r){

/* ---------- Vistas de relaciones ---------- */
const relWhat = t => t === 'alianza' ? 'Os propone una alianza 🤝' : 'Os lanza un pique ⚔️';

}
function relPendRows(type){

const relCanAdd = type => Rel.owner() && Rel.active(type).length < REL.max && Clan.clans.some(c => c._id !== Rel.cid && !Rel.with(c._id) && !Rel.gone.has(c._id));

  try { const r = await fetch('sw.js?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return null; const m = (await r.text()).match(/VERSION\s*=\s*'hierro-([\d.]+)'/); return m ? m[1] : null; } catch (e) { return null; }

  if (SWREG) {
    try { await SWREG.update(); } catch (e) {}
    const t0 = Date.now();
    while (!UPDATE && SWREG.installing && Date.now() - t0 < (manual ? 8000 : 20000)) await new Promise(r => setTimeout(r, 150));
    if (!UPDATE && SWREG.waiting) UPDATE = SWREG.waiting;
  }
  if (UPDATE) { render(); return 'update'; }

  // antes de borrar nada, comprueba que la red trae la app (si no, se queda como está y funciona sin conexión)

/* =========================================================
   Tirar para actualizar (#view, en lo alto): arrastrar hacia abajo y soltar
   ========================================================= */
function pullRefresh(){
  const wait = async (ok, ms) => { const t0 = Date.now(); while (!ok() && Date.now() - t0 < ms) await new Promise(r => setTimeout(r, 120)); };
  const root = !cur();
  // 4.9.3: tirar hacia abajo también busca versión nueva y la aplica (si no hay entreno en curso)
  const upd = checkUpdate(true).then(st => {
    if (st === 'busy') { toast('Descargando la versión nueva…'); return; }
    if (st !== 'update' && st !== 'stuck') return;
    if (S.active) { toast('Hay una versión nueva: toca «Actualizar»'); return; }
    toast('Actualizando a la versión nueva…'); autoUpdate(true);
  }).catch(() => {});
  const job = (async () => {
    if (root && tab === 'clan' && Cloud.enabled() && Cloud.session && Social.ready()) {
      Clan.err = null;
      const ps = [Clan.load(true, true)]; // tirar para actualizar: la liga entera
      if (typeof Rel !== 'undefined' && Rel.load) ps.push(Rel.load(true));
      await Promise.all(ps);
      await wait(() => !Clan.loading && !(typeof Rel !== 'undefined' && Rel.loading), 7000);
      clanRender();
      if (Clan.err) toast(Clan.err);
    } else if (root && tab === 'social' && Social.ready()) {
      await Social.refresh(true);
      await wait(() => !Social.loading, 7000);
      socRender();
      if (Social.err) toast(Social.err);
    } else {
      if (Sync.on()) { Sync.pulledAt = 0; await Sync.run(); } // tirar para actualizar siempre baja lo nuevo
      render();
    }
  })().catch(e => { console.warn('pull', e); });
  return Promise.race([Promise.all([job, upd]), new Promise(r => setTimeout(r, 8000))]);
}
